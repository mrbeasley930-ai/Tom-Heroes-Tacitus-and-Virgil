const BOOKLET = {
  id: "HVB1", book: "hvtom27-b1", num: 1,
  series: "Eduqas GCSE Latin · Component 2 · Heroes and Villains (2027–29)",
  title: "Roman anti-heroes",

  themeNote: "The specification names three ideas the examiners can build a 16-mark essay around: <b>the characteristics of a Roman hero</b>, <b>can women be heroes?</b>, and <b>Roman anti-heroes</b>. This booklet is the third of those. Sejanus and Mezentius are two of the four 'villains' in the Resource Booklet (the others are Antony in Cicero and Sempronia in Sallust). Everything you read here is evidence for the villain side of an essay, and for the question of whether a villain can do a heroic thing.",

  passages: [
  /* =================================================================
     PASSAGE 1 · Tacitus, Annals 4.1
     ================================================================= */
  { id:"tac1", short:"1 · Sejanus: the portrait", author:"Tacitus", work:"<i>Annals</i> 4.1", lines:"lines 1–11",
    heading:"Sejanus: the portrait",
    intro:"Tacitus opens Book 4 of the <i>Annals</i> (AD 23) by stopping the story to sketch the man who is about to dominate it. Lucius Aelius Seianus, Prefect of the Praetorian Guard, will control access to Tiberius after the emperor leaves Rome for Capri in AD 26, will be the most feared man in the empire, and will be denounced and executed in AD 31. Tacitus writes every line knowing that ending. The passage has a shape: a sentence of introduction, a career, the grip on Tiberius, the real cause, and then a verbless list of qualities in which every apparent virtue is a disguise.",
    facts:[
      ["Full name","Lucius Aelius Seianus, born at Vulsinii (modern Bolsena) in Etruria; father a Roman <i>eques</i>, so the family was equestrian, not senatorial"],
      ["Early career","Attached himself to Gaius Caesar, grandson of Augustus and one of his intended heirs (Gaius died AD 4)"],
      ["Under Tiberius","Prefect of the Praetorian Guard (the emperor's bodyguard, the only troops in Rome); Tiberius' most trusted adviser"],
      ["AD 26","Tiberius leaves Rome for Campania and then Capri; Sejanus controls who reaches him"],
      ["AD 31","Denounced to the senate by letter from Tiberius, executed the same day; his children killed"],
      ["Tacitus' angle","Writing c. AD 115, hostile to the imperial system; famous for brevity, omitted verbs, abstract nouns, and the epigram that stings at the end of a sentence"]
    ],
    rows:[
      { ln:"1", lat:"[[t1a|nunc Seiani originem, mores expediam.]]",
        en:"Now I shall set out the origin and character of Sejanus." },
      { ln:"1–3", lat:"[[t1b|genitus Vulsiniis patre / equite Romano]], et cum iuvenis esset [[t1c|divi Augusti nepotem / sectatus est]].",
        en:"Born at Vulsinii, his father being a Roman knight, when he was a young man he attached himself to the grandson of the deified Augustus." },
      { ln:"3–5", lat:"mox Seianus Tiberium [[t1d|variis artibus devinxit]] adeo ut / imperatorem [[t1e|obscurum adversum alios sibi uni incautum / intectumque]] efficeret,",
        en:"Soon Sejanus bound Tiberius to himself by various tricks, to such an extent that he made an emperor who was secretive towards everyone else off his guard and unprotected towards himself alone," },

        en:"not so much through cleverness (for indeed he was beaten by those same tricks) as through the anger of the gods against the Roman state, to whose equal ruin he both flourished and fell." },

        what:"<i>expediam</i> is first person and future: Tacitus interrupts the year-by-year narrative to speak in his own voice, and the verb literally means 'unravel' or 'disentangle' (<i>ex</i> + <i>pes</i>, to free the feet). <i>originem, mores</i> are set side by side with no 'and' (asyndeton): where he came from, and what he was like. The sentence is a signpost that a formal character sketch is coming, of the kind Sallust wrote for Catiline.",
        effect:"The reader is told to sit up: the story stops because this man matters. Choosing 'unravel' rather than 'describe' hints that Sejanus is a knot, something tangled that needs the historian's skill to lay open. The plain, short sentence also sets up the shock of the long, verbless list that follows.",
        ex:{ style:"Tacitus signals the importance of Sejanus by breaking off the narrative with <i>nunc Seiani originem, mores expediam</i>, 'now I shall set out the origin and character of Sejanus': the first-person future verb puts the historian's own authority behind the portrait, and the verb <i>expediam</i>, literally 'unravel', suggests that Sejanus is a puzzle that has to be untangled before the reader can understand the years that follow.",
             content:"We learn that Tacitus is deliberately pausing his account to describe Sejanus' background and character, which shows how central he considers Sejanus to be to the events of Tiberius' reign.",
             essay:"Tacitus stops his narrative to give Sejanus a formal character sketch, the treatment historians normally reserve for the great villains of Rome such as Sallust's Catiline, so even before any deeds are described the reader is prepared to see him as a threat rather than a hero." } },
      t1b:{ cat:"context", tag:"Where he came from", tr:"Born at Vulsinii, his father a Roman knight",
        what:"<i>genitus</i> has no <i>est</i>: Tacitus regularly drops parts of <i>esse</i>, and the clipped opening reads like an entry in a file. Vulsinii is an Etruscan town (modern Bolsena); <i>patre equite Romano</i> is an ablative of origin. An <i>eques</i> was wealthy and respectable but not a senator. Sejanus was therefore an outsider to the senatorial class that Tacitus belonged to and wrote for.",
        effect:"Two facts, no comment, and yet a Roman reader hears the judgement: a provincial equestrian will end up controlling the emperor. The bareness of the line makes the rise that follows seem more improper, and it is a fact the examiners can ask for directly.",
        ex:{ style:"The character sketch begins with the bare facts <i>genitus Vulsiniis patre equite Romano</i>, 'born at Vulsinii, his father a Roman knight', with the verb <i>est</i> omitted, so that the opening reads like an official record and quietly reminds the reader that a man of equestrian rank from an Etruscan town is about to master the emperor of Rome.",
             content:"Sejanus was born at Vulsinii, an Etruscan town, and his father was a Roman knight (an <i>eques</i>), so he came from the equestrian class rather than the senatorial aristocracy.",
             essay:"Tacitus makes a point of Sejanus' origins, an equestrian from the Etruscan town of Vulsinii, so that his later power looks like a usurpation of a place that a Roman aristocrat would think he had no right to." } },
      t1c:{ cat:"word", tag:"A hanger-on's verb", tr:"he attached himself to the grandson of the deified Augustus",
        what:"The grandson is Gaius Caesar, Augustus' adopted heir, who died in AD 4. <i>sectatus est</i> is a deponent (active in meaning) from <i>sector</i>, the frequentative of <i>sequor</i>: not 'followed' once but 'kept following about', the word for a client trailing a patron, even for a hunter after game. <i>divi Augusti</i> reminds us that Augustus was deified after death: this is the imperial family at its most sacred.",
        effect:"From his first appearance Sejanus is a climber choosing whom to attach himself to. The verb hints that the attachment was calculated, and that when Gaius died he simply transferred it: the next sentence begins <i>mox Seianus Tiberium</i>.",
        ex:{ style:"Tacitus chooses the verb <i>sectatus est</i>, 'attached himself to', for Sejanus' early career: a frequentative verb used of clients trailing after a patron, so that his loyalty to Gaius Caesar looks like the tactics of a hanger-on, and the reader is ready for him to transfer that attention to Tiberius as soon as Gaius is dead.",
             content:"As a young man Sejanus attached himself to Gaius Caesar, the grandson of the deified emperor Augustus.",
             essay:"Sejanus' career begins with him trailing after Augustus' grandson Gaius, and Tacitus presents this not as loyalty but as the first move of a man who chooses his patrons for what they can give him." } },
      t1d:{ cat:"word", tag:"Bound fast", tr:"bound Tiberius to himself by various tricks",
        what:"<i>devinxit</i> is from <i>devincio</i>, 'to tie up, bind fast', a word for ropes and chains used metaphorically of obligation. <i>variis artibus</i> is an ablative of instrument: <i>artes</i> can be honest skills or dishonest tricks, and the same phrase returns as <i>isdem artibus</i> in line 5, when the tricks are turned against him. Note the word order: <i>Seianus Tiberium</i> side by side, the prefect placed before the emperor.",
        effect:"The emperor is the one who ends up tied. The metaphor turns the relationship upside down: the servant binds the master. The reader is also being set up for the irony of line 5, where the binder is bound by the same means.",
        ex:{ style:"The metaphor in <i>variis artibus devinxit</i>, 'bound him by various tricks', presents the emperor as a captive: <i>devinxit</i> is the word for tying with ropes, and by placing <i>Seianus Tiberium</i> side by side with the prefect first, Tacitus lets the word order show who now controls whom.",
             content:"Sejanus won Tiberius over so completely by a variety of clever methods that the emperor became careless and unguarded towards him alone.",
             essay:"Tacitus describes Sejanus as having 'bound' Tiberius by tricks, a metaphor that makes the emperor a prisoner of his own prefect and marks Sejanus out as a manipulator rather than a loyal servant." } },
      t1e:{ cat:"order", tag:"Chiasmus: everyone else against Sejanus alone", tr:"secretive towards everyone else, but towards him alone off his guard and unprotected",
        what:"Two pairs arranged in a cross (chiasmus): adjective + <i>adversum alios</i> / <i>sibi uni</i> + adjectives. <i>obscurum</i> and <i>incautum intectumque</i> are opposites, and <i>alios</i> and <i>sibi uni</i> sit next to each other in the centre for maximum contrast. <i>intectus</i>, literally 'uncovered', is used nowhere else in Latin in this sense; with <i>incautum</i> it makes an alliterating pair.",
        effect:"Tiberius, famous for hiding his thoughts from everyone, is naked before one man. The crossing word order puts the whole court on one side and Sejanus on the other, and the coined word <i>intectum</i> makes the emperor sound physically exposed, like a man without armour.",
        ex:{ style:"Tacitus uses chiasmus in <i>obscurum adversum alios sibi uni incautum intectumque</i>, 'secretive towards everyone else, but towards him alone off his guard and unprotected': the contrasting words <i>alios</i> and <i>sibi uni</i> are placed side by side at the centre, so that the whole of Rome stands on one side and Sejanus alone on the other, and the unusual word <i>intectum</i>, 'uncovered', makes the emperor sound physically defenceless.",
             content:"Tiberius was normally secretive towards everyone else, but towards Sejanus alone he became careless and unguarded.",
             essay:"Tacitus stresses that Tiberius, secretive with everyone else, was 'unguarded' towards Sejanus alone, which shows the villain's real skill: he did not seize power, he made the most suspicious man in Rome trust him." } },
      t1f:{ cat:"structure", tag:"The real cause, and the fall foretold", tr:"not so much through cleverness (for he was beaten by those same tricks) as through the anger of the gods against the Roman state",
        what:"<i>non tam ... quam</i> corrects the explanation: not cleverness, but divine anger. The parenthesis <i>quippe isdem artibus victus est</i> leaps eight years ahead to the fall of AD 31, when Tiberius outwitted him with a letter to the senate. <i>deorum ira</i>: Tacitus often treats the gods as hostile to Rome, and here their target is <i>res Romana</i>, the state, not Sejanus himself. <i>sollertia</i> implies calculating shrewdness rather than intelligence.",
        effect:"The reader knows the ending before the portrait is finished, so every quality that follows is read with the knowledge that it did not save him. Making the gods' anger the cause also enlarges the story: Sejanus is not just a bad man but a punishment sent on Rome.",
        ex:{ style:"In <i>non tam sollertia ... quam deorum ira in rem Romanam</i>, 'not so much through cleverness as through the anger of the gods against the Roman state', Tacitus corrects the obvious explanation for Sejanus' rise, and the parenthesis <i>quippe isdem artibus victus est</i>, 'for he was beaten by those same tricks', foretells his fall in the very sentence that describes his success, so that the reader cannot admire the rise without seeing the ruin.",
             content:"Tacitus says Sejanus' success was due not so much to his cleverness as to the anger of the gods against Rome, and he adds that Sejanus was later defeated by the same tricks he had used himself.",
             essay:"Tacitus refuses to let Sejanus' rise be a story of talent: he says it happened because the gods were angry with Rome, which turns the villain into a disaster visited on the state rather than a man who earned his position." } },
      t1g:{ cat:"word", tag:"Epigram: rise and fall in two verbs", tr:"to whose equal ruin he both flourished and fell",
        what:"<i>viguit ceciditque</i> compresses a whole career into two perfect verbs joined by <i>-que</i>: 'he flourished and fell'. <i>pari exitio</i> is an ablative of attendant circumstances: the state was ruined equally by his rise and by his fall (the purge after AD 31 killed many more). This is a Tacitean epigram, a pointed short phrase closing a sentence.",
        effect:"The compression makes the fall seem to follow the rise almost instantly, as if they were one event. And the point is not sympathy: whether up or down, Sejanus destroyed Rome. The reader is being told how to feel before any evidence arrives.",
        ex:{ style:"The epigram <i>cuius pari exitio viguit ceciditque</i>, 'to whose equal ruin he both flourished and fell', compresses Sejanus' whole career into two verbs, and the phrase <i>pari exitio</i> insists that Rome suffered as much from his rise as from his fall, so that the reader is denied any admiration for his success.",
             content:"Tacitus says that Sejanus' rise and his fall did equal damage to the Roman state.",
             essay:"For Tacitus a villain is measured by damage to the state, and he says plainly that Sejanus' rise and fall brought Rome 'equal ruin', which is the opposite of the hero's test, where Horatius or Augustus is judged by what he saves." } },
      t1h:{ cat:"structure", tag:"A list without verbs", tr:"a body able to endure hardships, a bold mind",
        what:"From here to the end of line 11 there is not a single main verb: <i>erat</i> or <i>inerat ei</i> has to be supplied throughout (ellipsis). <i>corpus</i> and <i>animus</i>, body and mind, are set against each other; <i>laborum</i> is an objective genitive after <i>tolerans</i>. <i>audax</i> looks like praise but in Latin usually means reckless and lawless, the word used of Catiline.",
        effect:"Without verbs the sketch reads like a charge sheet, quality after quality with nothing to soften it. The pace is clipped and the tone is cold. And even the first, physical virtue, the body that can take hardship, is the quality Sejanus will use in the cave (4.59).",
        ex:{ style:"Tacitus strips out every verb in <i>corpus illi laborum tolerans, animus audax</i>, 'a body able to endure hardships, a bold mind', so that the character sketch reads like a list of charges rather than a description, and the adjective <i>audax</i>, which in Latin implies recklessness rather than courage, turns the one physical virtue he allows Sejanus into a warning.",
             content:"Sejanus had a body that could endure hard work and a bold, daring mind.",
             essay:"Even the qualities a hero would be praised for, physical toughness and daring, are given to Sejanus in a cold, verbless list, and Tacitus' word for daring, <i>audax</i>, is the one Romans used of the traitor Catiline." } },
      t1i:{ cat:"order", tag:"Himself against others", tr:"secretive about himself, an accuser of others",
        what:"<i>sui</i> and <i>alios</i> are set against each other (antithesis), and Tacitus varies the grammar deliberately (<i>variatio</i>): a participle with an objective genitive, <i>sui obtegens</i>, is balanced by a noun with a prepositional phrase, <i>in alios criminator</i>. <i>criminator</i>, 'accuser', is a very rare word.",
        effect:"Five words give a man with two faces: he hides everything about himself while exposing everyone else. The rare noun <i>criminator</i> makes accusation his profession, and this is exactly what he did, using treason trials to destroy rivals. Asyndeton (no 'and') keeps the pairs falling like blows.",
        ex:{ style:"The antithesis <i>sui obtegens, in alios criminator</i>, 'secretive about himself, an accuser of others', sets <i>sui</i> against <i>alios</i> to show a man of two faces, and the rare noun <i>criminator</i> makes accusing people his occupation, which is precisely how Sejanus used the treason trials against his enemies.",
             content:"Sejanus concealed everything about himself while accusing other people.",
             essay:"Tacitus calls Sejanus 'an accuser of others' who hid everything about himself, the portrait of an informer, and no Roman could think an informer heroic." } },
      t1j:{ cat:"order", tag:"Juxtaposition made literal", tr:"flattery and arrogance side by side",
        what:"<i>iuxta</i> is an adverb, 'side by side, together', and the two abstract nouns that follow are opposites that could not normally live in one man: grovelling flattery and haughty pride. Tacitus is fond of pairing opposites like this. The point is that they were aimed at different people: flattery upwards to Tiberius, arrogance downwards to everyone else.",
        effect:"The word <i>iuxta</i> tells the reader that the placing is the point: the contradiction is physically set in front of us. The reader sees a man whose behaviour depends entirely on who is watching.",
        ex:{ style:"Tacitus makes the juxtaposition literal in <i>iuxta adulatio et superbia</i>, 'flattery and arrogance side by side': the adverb <i>iuxta</i> draws attention to the placing of two opposite qualities, fawning to those above him and contempt for those below, so that Sejanus' character is shown to change according to who is watching.",
             content:"Sejanus combined flattery (towards his superiors) with arrogance (towards everyone else).",
             essay:"Sejanus' 'flattery and arrogance side by side' is the mark of the courtier-villain: he treats the emperor and the rest of Rome in opposite ways, whereas Livy's Horatius behaves the same towards everyone." } },
      t1k:{ cat:"order", tag:"Outside against inside", tr:"outwardly a composed modesty, inwardly a supreme craving for power",
        what:"<i>palam</i> ('openly') and <i>intus</i> ('within') are placed first in their phrases and set against each other. <i>compositus</i> can mean 'calm' but with <i>palam</i> it means 'put together, contrived': a modesty that was an act. <i>libido</i> is a violent word, uncontrolled lust; <i>summa</i> is neuter plural, 'the highest things', i.e. supreme power; <i>apiscendi</i> is a rare simple verb where <i>adipiscendi</i> would be usual.",
        effect:"This is the key to the whole portrait: surface against interior. What Rome saw was a performance; what drove him was appetite. The strong sexual colouring of <i>libido</i> makes the desire for power sound like a disease, and the reader is told to distrust everything visible about him, including the courage in the cave.",
        ex:{ style:"The antithesis of <i>palam compositus pudor, intus summa apiscendi libido</i>, 'outwardly a composed modesty, inwardly a supreme craving for power', places <i>palam</i> and <i>intus</i> at the head of each phrase to divide the man into surface and interior, and the word <i>libido</i>, normally used of lust, makes his ambition sound like an appetite he cannot control.",
             content:"On the outside Sejanus showed a calm, apparently modest manner, but inside he was consumed by a desire to gain supreme power.",
             essay:"Tacitus' central charge is that Sejanus' modesty was 'put on' while inside he craved supreme power, so that any apparently heroic act, including saving Tiberius' life, has to be read as part of the performance." } },
      t1l:{ cat:"structure", tag:"Good qualities in a bad cause", tr:"at one time generosity and extravagance, more often hard work and watchfulness",
        what:"Two balanced pairs, marked <i>modo</i> ... <i>saepius</i> ('sometimes ... more often'), the first alliterating (<i>largitio et luxus</i>). <i>eiusque causa</i> ties all four to the craving for power: everything was done 'for its sake'. <i>industria ac vigilantia</i> are the virtues Romans praised most in a public man, and Tacitus deliberately lists them alongside the vices.",
        effect:"The reader is being taught to distrust virtue itself. Hard work and watchfulness are good in a consul and terrifying in a man who wants a throne, because they make him effective. Tacitus is preparing the sting of the last clause.",
        ex:{ style:"Tacitus balances two pairs, <i>modo largitio et luxus, saepius industria ac vigilantia</i>, 'at one time generosity and extravagance, more often hard work and watchfulness', and by attaching them all to <i>eiusque causa</i>, 'for its sake', he makes the reader see even Sejanus' genuine virtues of diligence as tools of his ambition.",
             content:"For the sake of gaining power Sejanus was sometimes generous and extravagant, and more often hard-working and watchful.",
             essay:"Tacitus even lists Sejanus' hard work and vigilance, qualities Romans admired in a magistrate, and then says they were 'no less harmful' because they served his ambition: the villain is more dangerous, not less, for possessing a hero's virtues." } },
      t1m:{ cat:"word", tag:"The sting: feigned for a throne", tr:"no less harmful whenever they are feigned for the winning of royal power",
        what:"<i>haud minus noxiae</i> is feminine plural agreeing with <i>industria ac vigilantia</i>: the virtues are 'no less harmful' than the vices. <i>finguntur</i>, present tense, is a general truth about anyone who fakes virtue; <i>quotiens</i>, 'whenever', implies repeated performances. <i>parando regno</i> is a gerundive of purpose, and <i>regnum</i>, kingship, is the most hated word in Roman politics, the thing the Republic was founded to abolish.",
        effect:"The sentence ends on the two most damning words available, <i>regno</i> and <i>finguntur</i>: he wanted a throne, and everything good about him was a fake. This is the Tacitean epigram: a short, pointed clause at the end of a long sentence that changes the meaning of everything before it.",
        ex:{ style:"The passage ends on an epigram, <i>haud minus noxiae quotiens parando regno finguntur</i>, 'no less harmful whenever they are feigned for the winning of royal power': the last two words carry the whole charge, <i>regno</i> naming the kingship that every Roman was taught to hate and <i>finguntur</i> exposing his virtues as an act, so that the reader looks back over the list and trusts none of it.",
             content:"Tacitus says that Sejanus' good qualities were just as harmful as his bad ones, because they were only pretended in order to win supreme (royal) power.",
             essay:"The word Tacitus ends on is <i>regnum</i>, kingship: Sejanus wanted the one thing a Roman could not want, and that single ambition is enough to make him a villain in Roman eyes regardless of his courage or ability." } }
    },
    questions:[
      { id:"q1", marks:2, type:"content", q:"Lines 1–3 (<i>nunc ... sectatus est</i>): give <b>two</b> facts that Tacitus tells us about Sejanus' background.",
        model:"Any two of: he was born at Vulsinii; his father was a Roman knight (an <i>eques</i>); as a young man he attached himself to Gaius Caesar, the grandson of the deified Augustus.",
        scheme:["One mark for each fact, taken from within lines 1–3.","'Born in Etruria' is acceptable for Vulsinii; 'followed / was a follower of Augustus' grandson' is acceptable.","No mark for facts from later in the passage (e.g. that he won over Tiberius)."] },
      { id:"q2", marks:2, type:"latin", q:"Lines 3–5 (<i>mox ... efficeret</i>): pick out and translate the Latin word which shows that Tiberius normally hid his thoughts from other people.",
        model:"<i>obscurum</i> — 'secretive' / 'inscrutable' / 'hidden' (towards others).",
        scheme:["One mark for the Latin word copied exactly (<i>obscurum</i>).","One mark for a translation that carries the idea of hiding or secrecy; 'dark' or 'obscure' alone is not enough."] },
      { id:"q3", marks:3, type:"content", q:"Lines 5–7 (<i>non tam ... ceciditque</i>): what does Tacitus say was the real reason for Sejanus' success, and what two things does he tell us about Sejanus' downfall?",
        model:"The real reason was the anger of the gods against the Roman state (rather than Sejanus' own cleverness). About his downfall: he was defeated by the same tricks he had used himself; and his fall, like his rise, brought equal ruin to the state.",
        scheme:["1 mark: anger of the gods against Rome (must be against the state / Rome; 'gods were angry with Sejanus' is wrong).","1 mark: beaten / defeated by the same tricks or methods.","1 mark: his fall damaged Rome as much as his rise did."] },
      { id:"q4", marks:6, type:"style", q:"Lines 7–11 (<i>corpus illi ... finguntur</i>): how does Tacitus' style in these lines make Sejanus seem dangerous and untrustworthy? Make <b>three</b> points and refer to the Latin.",
        model:"<b>1.</b> There is no main verb anywhere in these lines (<i>corpus illi laborum tolerans, animus audax</i>, 'a body able to endure hardships, a bold mind'): the qualities are thrown down one after another like items on a charge sheet, and the cold, clipped pace makes Sejanus seem calculated rather than human. <b>2.</b> Tacitus builds the sketch out of opposites placed against each other: <i>sui obtegens, in alios criminator</i>, 'secretive about himself, an accuser of others', and <i>palam compositus pudor, intus summa apiscendi libido</i>, 'outwardly a composed modesty, inwardly a supreme craving for power'. The antithesis of <i>palam</i> and <i>intus</i> divides the man into a surface and an interior, so that nothing visible about him can be trusted. <b>3.</b> The strong word <i>libido</i>, normally used of lust, makes his ambition an uncontrollable appetite, and the epigram that closes the passage, <i>quotiens parando regno finguntur</i>, 'whenever they are feigned for the winning of royal power', ends on the two most damning words in Roman politics: his virtues were an act (<i>finguntur</i>) and their aim was a throne (<i>regno</i>). (Also creditable: <i>iuxta adulatio et superbia</i>, flattery and arrogance literally 'side by side'; <i>audax</i> meaning reckless; the alliteration of <i>largitio et luxus</i>; even good qualities called <i>haud minus noxiae</i>.)",
        scheme:["Two marks per point: Latin quoted + what Tacitus does with it + the effect, linked to 'dangerous' or 'untrustworthy'.","Naming a device (antithesis, asyndeton) without explaining its effect on the reader scores one mark at most for that point.","All Latin must come from lines 7–11."] },
      { id:"q5", marks:2, type:"interp", q:"What impression do you get of Tacitus' attitude to Sejanus from this passage? Give <b>one</b> reason for your answer.",
        model:"Tacitus is openly hostile: he presents Sejanus as a fraud whose apparent virtues (modesty, hard work) were faked in order to win supreme power, and he says his career brought ruin to Rome. (Any impression supported by a reason from the passage is creditable: e.g. contempt, because he calls him an accuser of others; or that Tacitus sees him as a punishment from the gods on Rome.)",
        scheme:["1 mark for a clear impression (hostile, contemptuous, suspicious, condemning).","1 mark for a reason grounded in the passage. An impression with no reason scores 1 at most."] }
    ]
  },

  { id:"tac2", short:"2 · Sejanus: the cave", author:"Tacitus", work:"<i>Annals</i> 4.59", lines:"lines 12–21",
    heading:"Sejanus: the cave at Spelunca",
    intro:"AD 26. Tiberius has left Rome, beginning the retirement from which he will never return, and is travelling through Campania with Sejanus beside him. Tacitus has just told us that one motive for the journey was Sejanus' own encouragement. Then, at a dinner in a villa built into a natural cave, the roof comes down. This is the one episode in the prescribed text where Sejanus does something that looks like heroism, and Tacitus lets us see it clearly, with the portrait of 4.1 already in our heads.",
    facts:[
      ["When","AD 26, in the days after Tiberius left Rome for Campania (he would settle on Capri in AD 27 and never come back)"],
      ["Where","A villa called Spelunca, 'the Cave', on the coast between the bay of Amyclae and the hills of Fundi; the dining room was inside a natural grotto (the modern town is Sperlonga, and the cave with its sculptures can still be visited)"],
      ["What happened","Rocks fell from the mouth of the cave and crushed some of the servants; the other guests fled"],
      ["What Sejanus did","Crouched over Tiberius on his knees and hands, taking the falling rocks on his own back, and was found like that by the soldiers who came to help"],
      ["Result","Tiberius trusted him more than ever: he was listened to <i>cum fide</i> even when his advice was ruinous"],
      ["Why it matters","This is the evidence for the 'hero' side of the question 'A Hero or a Villain?'; Tacitus frames it so that we read the courage as an investment"]
    ],
    rows:[
      { ln:"12–14", lat:"[[t2a|ac forte illis diebus]] Caesari [[t2b|anceps periculum]] [[t2c|oblatum est / praebuitque]] ipsi [[t2d|materiem cur amicitiae constantiaeque Seiani / magis fideret]].",
        en:"And by chance in those days a critical danger befell Caesar, and it gave him grounds for trusting more in the friendship and steadfastness of Sejanus." },
      { ln:"14–15", lat:"[[t2e|vescebantur in villa, cui vocabulum Speluncae]], [[t2f|mare / Amunclanum inter et Fundanos montes]] nativo in specu.",
        en:"They were dining in a villa whose name was Spelunca, between the sea of Amunclae and the hills of Fundi, in a natural cave." },
      { ln:"15–17", lat:"[[t2g|eius os / lapsis repente saxis obruit quosdam ministros]]: [[t2h|hinc metus in omnes / et fuga eorum qui convivium celebrabant]].",
        en:"Its mouth, the rocks having suddenly collapsed, crushed some of the servants: from this came fear among everyone and the flight of those who were attending the banquet." },
      { ln:"17–19", lat:"[[t2i|Seianus genu utroque et / manibus super Caesarem suspensus]] [[t2j|opposuit sese incidentibus]] / atque [[t2k|habitu tali repertus est a militibus qui subsidio venerant]].",
        en:"Sejanus, poised over Caesar on both knees and his hands, set himself in the way of the falling rocks, and was found in this posture by the soldiers who had come to help." },
      { ln:"19–21", lat:"[[t2l|maior / ex eo]] et, [[t2m|quamquam exitiosa suaderet]], [[t2n|ut non sui anxius cum fide / audiebatur]].",
        en:"From this he was greater, and although the advice he gave was ruinous, he was listened to with trust, as a man not anxious for himself." }
    ],
    notes:{
      t2a:{ cat:"context", tag:"'By chance': when and where we are", tr:"And by chance in those days",
        what:"<i>forte</i>, 'by chance', is the first thing Tacitus says about the episode. <i>illis diebus</i> places it in AD 26, just after Tiberius has left Rome for Campania. Tacitus has already told us (4.57) that Sejanus urged the emperor to leave, because an emperor away from Rome could be controlled through the letters and visitors Sejanus filtered.",
        effect:"'Chance' quietly removes any credit from Sejanus for the opportunity, and the reader who remembers 4.1 (<i>deorum ira</i>) may suspect that what looks like chance is the gods' anger working against Rome. The timing also matters: the danger arrives at the very moment Sejanus most needs the emperor's trust.",
        ex:{ style:"Tacitus opens the episode with <i>ac forte illis diebus</i>, 'and by chance in those days', so that the rock fall is presented as an accident of timing rather than anything Sejanus earned, and the reader who remembers the 'anger of the gods' in 4.1 is invited to see chance working, as usual in Tacitus, against Rome's interests.",
             content:"The danger to Tiberius happened by chance during the days (of AD 26) when he had just left Rome and was travelling in Campania with Sejanus.",
             essay:"Tacitus is careful to call the cave incident a matter of chance: Sejanus did not create the opportunity to be a hero, he only used it, which fits the calculating character drawn in 4.1." } },
      t2b:{ cat:"word", tag:"A double-edged danger", tr:"a critical danger",
        what:"<i>anceps</i> literally means 'two-headed' (<i>ambi</i> + <i>caput</i>), and so 'uncertain, critical, capable of going either way'. Applied to a danger it means life-or-death. But the word also carries its literal sense into a passage about a man with two faces.",
        effect:"The reader feels the danger was real and the outcome uncertain, which makes Sejanus' act more impressive; and the pun on 'two-headed' lets Tacitus hint that the danger will cut both ways, saving Tiberius' life while handing his judgement to Sejanus.",
        ex:{ style:"Tacitus calls the rock fall <i>anceps periculum</i>, 'a critical danger', and the adjective, which literally means 'two-headed', suits an episode that cuts two ways: it saves the emperor's life and at the same time delivers his trust to the man who will misuse it.",
             content:"Tacitus says that Tiberius faced a critical (life-threatening) danger.",
             essay:"The danger in the cave was genuine, a 'critical' one in Tacitus' word, which is why the episode is the strongest evidence anyone can bring for calling Sejanus a hero." } },
      t2c:{ cat:"structure", tag:"Two verbs, one meaning", tr:"befell him and gave him",
        what:"<i>oblatum est</i> (passive) and <i>praebuit</i> (active) mean almost the same thing, 'was presented' and 'offered'. Tacitus says the same idea twice with a change of voice and construction: this is <i>variatio</i>, his habit of avoiding repetition by varying the grammar.",
        effect:"The doubling slows the sentence down and makes the reader dwell on what the danger 'offered': not a rescue but <i>materiem</i>, an opportunity. The sentence is about consequences before the event has even been described.",
        ex:{ style:"Tacitus uses <i>variatio</i> in <i>oblatum est praebuitque</i>, 'befell him and gave him', two verbs of almost identical meaning but opposite voice, so that the sentence lingers on what the danger produced, the trust that Sejanus would exploit, before it tells us what the danger was.",
             content:"The danger gave Tiberius a reason to trust Sejanus' friendship and loyalty more than before.",
             essay:"Tacitus tells us the result of the cave episode, that it gave Tiberius grounds to trust Sejanus, before he tells the story itself, so that the reader knows from the start that the heroism is going to be turned to use." } },
      t2d:{ cat:"word", tag:"'Material' for trust", tr:"grounds for trusting more in the friendship and steadfastness of Sejanus",
        what:"<i>materies</i> is literally 'timber, raw material', and so 'occasion, grounds'. <i>fideret</i> is subjunctive in an indirect question after <i>cur</i>. <i>amicitiae constantiaeque</i> are the two qualities Tiberius believed in: friendship and steadfastness, the words a Roman used of a loyal ally.",
        effect:"Calling the episode 'material' makes the danger sound like a resource that Sejanus worked up, and the word is Tacitus' rather than Tiberius'. The reader sees the emperor supplied with reasons to believe what the prefect wanted him to believe.",
        ex:{ style:"The word <i>materiem</i>, literally 'raw material', in <i>praebuitque ipsi materiem cur ... magis fideret</i>, 'gave him grounds for trusting more', turns the rescue into a resource: the danger provided something that could be worked into the trust Sejanus needed, and the genitives <i>amicitiae constantiaeque</i> name the two virtues that Tiberius, and only Tiberius, believed he had.",
             content:"The incident gave Tiberius reason to have more confidence in Sejanus' friendship and his loyalty (steadfastness).",
             essay:"Tacitus describes the cave incident as 'material' for Tiberius' trust, a word that makes Sejanus' courage look like something manufactured for a purpose, which is the villain's version of a heroic deed." } },
      t2e:{ cat:"context", tag:"Dinner in the Cave", tr:"They were dining in a villa whose name was Spelunca",
        what:"<i>vescebantur</i> is a deponent imperfect: the meal is in progress when disaster strikes. <i>cui vocabulum Speluncae</i>: the villa's name was 'the Cave' (the modern Sperlonga), and <i>nativo in specu</i> tells us the dining room really was a natural grotto, an extravagant fashion in villa design. Archaeologists have excavated it, with its sculptures of Odysseus.",
        effect:"The setting is luxury: an emperor dining inside a cave for the pleasure of it. That the roof of a pleasure-dome fell in gives the episode a faint moral edge, and the imperfect tense puts the reader at the table when the rocks fall.",
        ex:{ style:"The imperfect deponent <i>vescebantur</i>, 'they were dining', places the reader in the middle of the meal, and the detail <i>cui vocabulum Speluncae ... nativo in specu</i>, 'whose name was the Cave ... in a natural grotto', makes clear that the setting was a luxurious dining room built into living rock, so that the collapse is both a natural accident and a comment on imperial extravagance.",
             content:"They were dining in a villa called Spelunca ('the Cave'), which had its dining room inside a natural cave, on the coast between the bay of Amyclae and the hills of Fundi.",
             essay:"The setting of the rescue, an emperor dining inside a natural cave at a luxury villa, is itself part of Tacitus' picture of a court in which the prefect had made himself indispensable." } },
      t2f:{ cat:"order", tag:"The preposition sits between", tr:"between the sea of Amunclae and the hills of Fundi",
        what:"<i>inter</i> normally comes first; here it is placed between its two objects (<i>mare Amunclanum inter et Fundanos montes</i>). This delayed preposition is called anastrophe. The bay of Amyclae is the sea; Fundi (modern Fondi) is a town inland with hills behind it.",
        effect:"The word order enacts the geography: the word 'between' is itself between the sea and the hills. It is a small poetic flourish in a prose historian, and it shows Tacitus taking care over the scene before the violence.",
        ex:{ style:"In <i>mare Amunclanum inter et Fundanos montes</i>, 'between the sea of Amunclae and the hills of Fundi', Tacitus delays the preposition <i>inter</i> so that it stands between its two nouns, and the word order mirrors the position of the villa, caught between sea and mountain.",
             content:"The villa stood between the sea (the bay of Amunclae) and the hills of Fundi.",
             essay:"" } },
      t2g:{ cat:"order", tag:"The cave's mouth as the attacker", tr:"Its mouth, the rocks having suddenly collapsed, crushed some of the servants",
        what:"We expect 'at the mouth of the cave rocks fell'; instead <i>os</i>, the mouth, is the subject and <i>obruit</i>, 'crushed, buried', is its verb. The rock fall is compressed into an ablative absolute, <i>lapsis repente saxis</i>, with <i>repente</i> ('suddenly') at its centre. <i>quosdam ministros</i>, 'some of the servants': the victims are unnamed and uncounted.",
        effect:"The cave is made to act, its mouth crushing men as if it were swallowing them, which gives the accident the feel of an attack. The ablative absolute makes the collapse instantaneous: three words, and it has happened. The reader has no more warning than the diners.",
        ex:{ style:"Tacitus makes the cave the attacker in <i>eius os lapsis repente saxis obruit quosdam ministros</i>, 'its mouth, the rocks having suddenly collapsed, crushed some of the servants': the mouth of the cave is the subject of the violent verb <i>obruit</i>, as if it were swallowing the diners, and the three-word ablative absolute with <i>repente</i> at its centre makes the collapse as sudden for the reader as it was for the guests.",
             content:"Rocks suddenly fell from the mouth of the cave and crushed some of the servants.",
             essay:"" } },
      t2h:{ cat:"structure", tag:"Panic without verbs", tr:"from this came fear among everyone and the flight of those who were attending the banquet",
        what:"After the colon there is no verb at all: <i>metus</i> and <i>fuga</i>, fear and flight, are simply set down as abstract nouns. Tacitus prefers this to the obvious <i>omnes metuerunt et fugerunt</i>. <i>in omnes</i> makes the fear universal; <i>eorum qui convivium celebrabant</i> is a slightly grand phrase for the party guests.",
        effect:"With no verb there is no time: fear and flight are instantaneous, and the reader sees a room emptying in a single glance. The universal <i>in omnes</i> is the foil for the next sentence, where one man does not run.",
        ex:{ style:"The verbless phrase <i>hinc metus in omnes et fuga</i>, 'from this, fear among everyone and flight', throws down the two abstract nouns without a verb, as if there were no time to complete a sentence, and the word <i>omnes</i> prepares the contrast with the single man, named first in the next sentence, who stays.",
             content:"Everyone was afraid and the guests at the dinner fled.",
             essay:"Tacitus makes everyone else flee the cave so that Sejanus' decision to stay stands out; even a hostile historian gives the villain his one unmistakably brave moment." } },
      t2i:{ cat:"order", tag:"One man stays: the body as a roof", tr:"Sejanus, poised over Caesar on both knees and his hands",
        what:"<i>Seianus</i> is the first word, set directly against the <i>fuga</i> of everyone else. Then Tacitus builds him physically: <i>genu utroque et manibus</i> (ablatives of instrument, each knee and both hands), <i>super Caesarem</i> (his body above the emperor's), <i>suspensus</i> (held up, arched). It is the posture of a man making himself a roof.",
        effect:"The picture is exact and unheroic in its vocabulary, knees and hands rather than sword and shield, which makes it more convincing. The reader can see it; so, Tacitus will say, could the soldiers. And the toughness of <i>corpus laborum tolerans</i> from 4.1 is shown in action.",
        ex:{ style:"Against the flight of everyone else Tacitus places the name <i>Seianus</i> first in its sentence and then builds a physical picture, <i>genu utroque et manibus super Caesarem suspensus</i>, 'poised over Caesar on both knees and his hands': the ablatives name each knee and both hands, and <i>super Caesarem</i> puts his body above the emperor's like a roof, so the reader sees exactly how the emperor was saved.",
             content:"Sejanus crouched over Tiberius, supporting himself on both knees and his hands, and used his body to shield the emperor from the falling rocks.",
             essay:"Sejanus shielding the emperor with his own body, on his knees and hands under falling rock, is a physically courageous act by any standard, and the essay has to admit it before explaining why Tacitus still does not call him a hero." } },
      t2j:{ cat:"word", tag:"Against the rocks still falling", tr:"set himself in the way of the falling rocks",
        what:"<i>opposuit sese</i>: he placed himself as a barrier (<i>ob</i> + <i>pono</i>), with the emphatic reflexive <i>sese</i> rather than plain <i>se</i>. <i>incidentibus</i> is a present participle with <i>saxis</i> understood: the rocks are still falling as he does it.",
        effect:"The present participle keeps the danger live; this is not a man protecting the emperor after the collapse but during it. The doubled reflexive <i>sese</i> stresses that what he put in the way was himself.",
        ex:{ style:"The phrase <i>opposuit sese incidentibus</i>, 'set himself in the way of the falling rocks', uses the present participle <i>incidentibus</i> to keep the rocks in motion, so that Sejanus is shielding the emperor while the danger continues, and the emphatic reflexive <i>sese</i> stresses that what he offered as a barrier was his own body.",
             content:"He placed himself in the path of the rocks that were still falling.",
             essay:"" } },
      t2k:{ cat:"structure", tag:"Found like that: the tableau and its witnesses", tr:"and was found in this posture by the soldiers who had come to help",
        what:"<i>habitu tali</i> is a local ablative, 'in such a posture'; <i>repertus est</i>, 'was found', is passive, with <i>a militibus</i> as the agent; <i>subsidio</i> is a predicative dative, 'for help'. The soldiers are Praetorians, his own men.",
        effect:"Tacitus does not say 'he saved the emperor'; he says he was found in that position. The heroism is presented as a picture that had witnesses, and the witnesses are the soldiers who will carry the story. A suspicious reader notices that the act was not only brave but seen.",
        ex:{ style:"Tacitus ends the rescue not with the emperor saved but with a tableau: <i>habitu tali repertus est a militibus</i>, 'he was found in this posture by the soldiers'. The passive verb makes Sejanus the object of other men's eyes, and by naming the witnesses Tacitus suggests that the courage mattered because it was seen and would be reported.",
             content:"The soldiers who came to help found Sejanus still in that position, shielding the emperor.",
             essay:"Tacitus chooses to describe the rescue as a scene the soldiers 'found', which lets the reader wonder whether Sejanus' courage was also a performance for an audience, as his modesty was in 4.1." } },
      t2l:{ cat:"word", tag:"Greater from this", tr:"From this he was greater",
        what:"Three words where a fuller writer would need a sentence (<i>Seianus ex eo discrimine maior factus est</i>). <i>maior</i> means 'more influential, more powerful', not morally greater. This brevity is Tacitus' trademark.",
        effect:"The reward is stated as flatly as an entry in an account book: risk taken, profit made. The reader is being nudged from the deed to its use.",
        ex:{ style:"Tacitus sums up the result in three words, <i>maior ex eo</i>, 'from this he was greater', with the verb left out: the brevity makes the gain in power sound like a transaction, the return on the risk just taken.",
             content:"As a result of the incident Sejanus became more powerful and influential.",
             essay:"The immediate consequence of the rescue, in Tacitus' three-word summary, is that Sejanus 'was greater': the heroic act is measured by what it bought him." } },
      t2m:{ cat:"word", tag:"The sting in the tail", tr:"although the advice he gave was ruinous",
        what:"<i>quamquam</i> with the subjunctive <i>suaderet</i> (earlier Latin used the indicative). <i>exitiosa</i>, 'deadly, ruinous', picks up <i>exitio</i> in 4.1 line 6: the same root, the same judgement. The clause is tucked into the middle of the sentence, between the reward and the trust.",
        effect:"Tacitus cannot let the heroism stand for a clause without qualifying it. The reader is reminded, in the very sentence that records Tiberius' trust, that the advice this trust purchased was destroying Rome. This is how the portrait of 4.1 controls the reading of 4.59.",
        ex:{ style:"Into the sentence that records Tiberius' new trust Tacitus inserts <i>quamquam exitiosa suaderet</i>, 'although the advice he gave was ruinous': the adjective <i>exitiosa</i> echoes the <i>exitio</i>, 'ruin', of the character sketch, so that the reader is reminded of the cost of the trust at the very moment it is won.",
             content:"Tacitus says that even though the advice Sejanus gave was harmful (ruinous), Tiberius listened to him with trust.",
             essay:"Tacitus allows the cave rescue to be brave but adds at once that the advice it bought a hearing for was 'ruinous', so the heroic act becomes the means by which the villain does his damage." } },
      t2n:{ cat:"order", tag:"'As a man not anxious for himself'", tr:"he was listened to with trust, as a man not anxious for himself",
        what:"<i>ut non sui anxius</i>: 'as (being) not anxious for himself', with <i>sui</i> an objective genitive, the same construction as <i>sui obtegens</i> in 4.1. <i>cum fide</i>, 'with trust', is Tiberius' state of mind; <i>audiebatur</i> is imperfect, 'used to be listened to', a habit from now on.",
        effect:"The word <i>ut</i> ('as') is doing quiet work: Tiberius listened to him as if he were unselfish. The reader who remembers <i>sui obtegens</i>, 'secretive about himself', hears the echo: the man who hid himself now appears to have no self-interest at all, and the emperor believes it. The imperfect makes the misjudgement permanent.",
        ex:{ style:"The closing words <i>ut non sui anxius cum fide audiebatur</i>, 'he was listened to with trust, as a man not anxious for himself', carry the irony of the whole episode: <i>ut</i> means 'as if', and <i>sui</i> echoes <i>sui obtegens</i> from the character sketch, so that the man who concealed himself is now believed to have no self-interest, and the imperfect <i>audiebatur</i> makes Tiberius' misplaced trust a habit rather than a moment.",
             content:"Tiberius came to trust Sejanus and listen to his advice, believing that he had no concern for his own interests.",
             essay:"Tiberius took the rescue as proof that Sejanus was 'not anxious for himself'; Tacitus' phrasing ('as if') tells the reader that this is exactly the misreading the villain was working for." } }
    },
    questions:[
      { id:"q1", marks:3, type:"content", q:"Lines 14–15 (<i>vescebantur ... specu</i>): describe where Tiberius and Sejanus were when the danger struck. Give <b>three</b> details.",
        model:"They were dining (at a banquet); in a villa called Spelunca ('the Cave'); which lay between the sea of Amunclae and the hills of Fundi; in a natural cave (the dining room was inside a grotto).",
        scheme:["One mark for each of any three details from within lines 14–15.","'Between the sea and the mountains' is enough for that detail; the proper names are not required.","'In a cave' and 'the villa was called the Cave' count as two separate details."] },
      { id:"q2", marks:2, type:"latin", q:"Lines 15–17 (<i>eius os ... celebrabant</i>): pick out and translate the Latin word which shows that the collapse was unexpected.",
        model:"<i>repente</i> — 'suddenly'.",
        scheme:["One mark for the Latin word copied exactly.","One mark for the translation ('suddenly', 'all of a sudden')."] },
      { id:"q3", marks:2, type:"content", q:"Lines 15–17: what happened to (i) some of the servants and (ii) the other guests?",
        model:"(i) They were crushed / buried by the falling rocks. (ii) They were terrified and fled (ran away from the dinner).",
        scheme:["1 mark for the servants being crushed or killed by the rocks.","1 mark for the guests panicking and fleeing; 'they were afraid' alone is not quite enough, the flight is the point."] },
      { id:"q4", marks:8, type:"style", q:"Lines 15–19 (<i>eius os ... venerant</i>): how does Tacitus make this a dramatic and vivid account of the rock fall and Sejanus' action? Make <b>four</b> points and refer closely to the Latin.",
        model:"<b>1. Suddenness compressed.</b> The ablative absolute <i>lapsis repente saxis</i>, 'the rocks having suddenly collapsed', packs the whole disaster into three words with <i>repente</i> at its centre, and the violent verb <i>obruit</i>, 'crushed', follows at once, so the reader has no more warning than the diners. <b>2. The cave attacks.</b> Tacitus makes <i>eius os</i>, 'its mouth', the subject of the sentence rather than saying that rocks fell at the cave's mouth: the cave seems to swallow the servants, which turns an accident into something like an assault. <b>3. Panic without verbs.</b> After the colon, <i>hinc metus in omnes et fuga</i>, 'from this, fear among everyone and flight', has no verb at all; fear and flight are thrown down as bare nouns, as if there were no time to finish a sentence, and <i>in omnes</i> makes the panic universal. <b>4. The one man who stays.</b> Against the flight of everyone else Tacitus places <i>Seianus</i> first in its sentence, then builds him physically, <i>genu utroque et manibus super Caesarem suspensus</i>, 'poised over Caesar on both knees and his hands', so the reader can see the emperor beneath a human roof; <i>opposuit sese incidentibus</i>, 'set himself in the way of the falling rocks', uses a present participle to keep the rocks in motion while he does it. (Also creditable: the tableau <i>habitu tali repertus est a militibus</i>, the hero frozen in position for witnesses to find; the emphatic reflexive <i>sese</i>.)",
        scheme:["Two marks per point: Latin quoted + explanation of what the writer does + effect, linked to 'dramatic' or 'vivid'.","Four distinct points are needed for full marks; a fifth point cannot compensate for a weak one.","Latin from outside lines 15–19 (e.g. <i>maior ex eo</i>) earns nothing here."] },
      { id:"q5", marks:2, type:"interp", q:"Lines 19–21 (<i>maior ... audiebatur</i>): do you think Tacitus wants the reader to admire Sejanus for what he did in the cave? Give <b>one</b> reason for your answer, based on these lines.",
        model:"No: even as he records that Sejanus became more powerful and was trusted, Tacitus adds that the advice Sejanus gave was ruinous (<i>quamquam exitiosa suaderet</i>), and he says Tiberius listened to him 'as if' he were not concerned for himself, which implies that he was. (A 'yes' answer is creditable if it is properly reasoned: e.g. yes, because Tacitus records that he was trusted as a man not anxious for himself, which suggests genuine courage.)",
        scheme:["1 mark for a clear yes/no.","1 mark for a reason drawn from lines 19–21. A reason from the cave scene itself (lines 15–19) does not answer this question."] }
    ]
  },

  { id:"virg", short:"3 · Mezentius", author:"Virgil", work:"<i>Aeneid</i> 8.478–495", lines:"lines 1–18 (= 478–495)",
    heading:"Mezentius: a king's gruesome behaviour",
    intro:"Aeneas has sailed up the Tiber to Pallanteum, the little town on the future site of Rome, to ask its king Evander for help against the Latins and Turnus. Evander is speaking. He is about to explain why a whole Etruscan army is waiting on the coast for a foreign leader, and why that leader could be Aeneas. To do it he must make Aeneas, and Virgil's reader, hate Mezentius. Line numbers below are the exam booklet's: line 1 is <i>Aeneid</i> 8.478.",
    facts:[
      ["Who is speaking","King Evander of Pallanteum, to Aeneas, at the end of a tour of the site of Rome; the whole passage is persuasion"],
      ["Agylla","The Etruscan city more usually called Caere, about thirty miles north-west of Rome; the Etruscans were believed to have come from Lydia in Asia Minor"],
      ["Mezentius","King of Caere, driven out by his own people for his cruelty; he fled to Turnus, king of the Rutuli, Aeneas' enemy. In Book 10 he fights the Trojans and is killed by Aeneas after the death of his son Lausus, who dies defending him"],
      ["Why it matters to Evander","The Etruscans want Mezentius back for punishment; Turnus shelters him; so the Etruscans are natural allies of Aeneas, and a prophecy says they must be led by a foreigner"],
      ["The label","In Book 7 Virgil calls Mezentius <i>contemptor divum</i>, 'despiser of the gods'; here Evander calls him a <i>tyrannus</i>"],
      ["A complication","In Book 10 Mezentius fights bravely and dies asking to be buried with his son; the villain of Book 8 becomes something more complicated"]
    ],
    rows:[
      { ln:"1–3", lat:"[[va|haud procul hinc]] saxo incolitur fundata vetusto / urbis Agyllinae sedes, ubi [[vb|Lydia quondam / gens, bello praeclara]], iugis insedit Etruscis.",
        en:"Not far from here, founded on ancient rock, stands the inhabited site of the city of Agylla, where once the Lydian race, famous in war, settled on the Etruscan ridges." },
      { ln:"4–5", lat:"hanc [[vc|multos florentem annos]] rex deinde [[vd|superbo / imperio et saevis tenuit Mezentius armis]].",
        en:"This city, flourishing for many years, king Mezentius then held with arrogant rule and cruel arms." },
      { ln:"6–7", lat:"[[ve|quid memorem infandas caedes, quid facta tyranni / effera?]] [[vf|di capiti ipsius generique reservent!]]",
        en:"Why should I recount the unspeakable slaughters, why the savage deeds of the tyrant? May the gods keep them in store for his own head and for his son-in-law!" },
      { ln:"8–9", lat:"[[vg|mortua quin etiam iungebat corpora vivis]] / [[vh|componens manibusque manus atque oribus ora]],",

        en:"a kind of torture, and, streaming with gore and putrefaction, in that wretched embrace he killed them like this by a lingering death." },
      { ln:"12–14", lat:"[[vl|at fessi tandem cives]] [[vm|infanda furentem]] / armati [[vn|circumsistunt ipsumque domumque, / obtruncant socios, ignem ad fastigia iactant]].",
        en:"But at last the citizens, worn out, armed themselves and surrounded him, raging in his unspeakable crimes, both the man and his house; they cut down his companions, they hurl fire onto the roof-tops." },
      { ln:"15–16", lat:"ille inter caedem Rutulorum elapsus in agros / [[vo|confugere et Turni defendier hospitis armis]].",
        en:"He, slipping away amid the slaughter, fled for refuge into the territory of the Rutulians and was defended by the arms of Turnus, his host." },
      { ln:"17–18", lat:"ergo omnis [[vp|furiis surrexit Etruria iustis]]: / [[vq|regem ad supplicium praesenti Marte reposcunt]].",
