    notes:{
      va:{ cat:"context", tag:"Evander points", tr:"Not far from here",
        what:"<i>hinc</i>, 'from here', is Pallanteum, the future Rome. Evander is speaking to Aeneas, and the whole passage is a speech with a purpose: to persuade Aeneas to accept the leadership of the Etruscan army. <i>saxo ... vetusto</i>, 'on ancient rock', and <i>fundata</i> give the city age and solidity; Agylla is Caere, about thirty miles from Rome.",
        effect:"The reader is placed on the ground with Aeneas, looking north. The old, well-founded city makes the tyranny that follows an outrage against something venerable. It also matters for the examiner's question about who is speaking and why: Evander needs Aeneas to hate Mezentius.",
        ex:{ style:"Evander begins with a gesture, <i>haud procul hinc</i>, 'not far from here', placing Aeneas and the reader on the site of Rome and looking towards Agylla, and the phrase <i>saxo ... fundata vetusto</i>, 'founded on ancient rock', gives the city an age and solidity that make the tyrant's abuse of it seem an outrage.",
             content:"The city of Agylla lay not far from Pallanteum, built on ancient rock, and had been settled long ago by the Lydian (Etruscan) people, who were famous in war.",
             essay:"The portrait of Mezentius is delivered by Evander, who is trying to persuade Aeneas to lead the Etruscans against him, so the essay should note that Virgil gives the villain's character through a speaker with every reason to blacken it." } },
      vb:{ cat:"context", tag:"A proud people", tr:"the Lydian race, famous in war",
        what:"The Etruscans were believed (by Herodotus and most ancient writers) to have migrated from Lydia in Asia Minor, and Virgil follows the tradition. <i>bello praeclara</i> is an ablative of respect: famous 'in war'. <i>quondam</i>, 'once', looks back to a golden past.",
        effect:"A warlike and distinguished people were reduced to enduring Mezentius. The praise of the Etruscans makes their suffering more shocking and their eventual revolt more admirable, and it flatters the army Aeneas is being asked to lead.",
        ex:{ style:"By calling the Etruscans <i>Lydia ... gens, bello praeclara</i>, 'the Lydian race, famous in war', Evander gives Mezentius' victims a proud history, so that the tyranny described next is an insult to a warlike people and their later uprising is the recovery of what they once were.",
             content:"The people of Agylla were Lydians (Etruscans, believed to have come from Lydia) and they were famous for war.",
             essay:"" } },
      vc:{ cat:"sound", tag:"Long years in a slow line", tr:"flourishing for many years",
        what:"<i>florentem</i> agrees with <i>hanc</i> (the city): it was blooming. <i>multos ... annos</i> is an accusative of duration. Line 4 is heavily spondaic (long syllables dominate: <i>hanc multos florentem annos rex deinde superbo</i>), so the metre slows down.",
        effect:"The slow rhythm stretches out the years of prosperity, so that <i>deinde</i>, 'then', and the tyrant's name at the end of the next line fall like a blow. The city's happiness is given time in the verse before it is taken away.",
        ex:{ style:"Line 4, <i>hanc multos florentem annos rex deinde superbo</i>, is heavily spondaic, and the slow rhythm draws out the many years in which the city was <i>florentem</i>, 'flourishing', so that the arrival of the tyrant, delayed to the next line, feels like the end of a long peace.",
             content:"The city had flourished (prospered) for many years before Mezentius ruled it.",
             essay:"" } },
      vd:{ cat:"order", tag:"The two words for a tyrant", tr:"with arrogant rule and cruel arms",
        what:"<i>superbo imperio</i> and <i>saevis armis</i> are ablatives of instrument: how he held the city. <i>superbus</i> is the name Romans gave their last king, Tarquinius Superbus, expelled for exactly this; <i>saevus</i> is the cruelty of a beast. The word order encloses: <i>rex ... Mezentius</i> frame the line, and the adjectives are separated from their nouns so that <i>superbo / imperio</i> runs over the line-end (enjambment).",
        effect:"A Roman reader hears the Tarquins in <i>superbo</i>: this is the kind of king Rome drove out. The enclosing order, with the king's name held back to the end of line 5, makes Mezentius arrive as the climax of his own crimes. The reader is given the verdict before the evidence.",
        ex:{ style:"Virgil gives Mezentius the two adjectives a Roman most feared in a ruler, <i>superbo imperio et saevis ... armis</i>, 'with arrogant rule and cruel arms': <i>superbus</i> was the title of Rome's last king, Tarquinius Superbus, so the tyrant is condemned by association, and the name <i>Mezentius</i> is held back to the very end of the sentence, arriving as the climax of the description of his rule.",
             content:"Mezentius ruled Agylla by arrogant (proud) power and by cruel force of arms.",
             essay:"Virgil's Mezentius is the Roman idea of a tyrant in miniature: 'arrogant rule and cruel arms', the same charge Romans brought against Tarquinius Superbus, and so the exact opposite of a hero like Horatius who fought to keep such a king out." } },
      ve:{ cat:"structure", tag:"'Why should I tell?' and then he tells", tr:"Why should I recount the unspeakable slaughters, why the savage deeds of the tyrant?",
        what:"<i>quid memorem</i> is a deliberative subjunctive, 'why should I relate?', and <i>quid</i> is repeated (anaphora) with a second object. The figure is <i>praeteritio</i>: claiming to pass over something while mentioning it. <i>infandas</i>, 'unspeakable', literally means 'not to be spoken'; <i>effera</i>, 'savage, bestial', is thrown to the start of the next line (enjambment) and followed by a full stop.",
        effect:"Evander pretends the crimes are too well known and too terrible to describe, which makes them sound worse, and then describes the worst in detail. The enjambed <i>effera</i>, isolated at the line's start, lands like a verdict: the tyrant is an animal.",
        ex:{ style:"Evander uses a rhetorical question with anaphora, <i>quid memorem infandas caedes, quid facta tyranni / effera?</i>, 'why should I recount the unspeakable slaughters, why the savage deeds of the tyrant?', pretending that the crimes need no telling before telling the worst of them, and the enjambment that isolates <i>effera</i>, 'bestial', at the start of line 7 leaves the reader with a single word of judgement.",
             content:"Evander says Mezentius committed unspeakable massacres and savage (bestial) deeds, so many that he need not list them.",
             essay:"Even before the torture is described, Virgil has Evander call Mezentius' deeds 'unspeakable' and 'bestial', words that place him outside human behaviour altogether." } },
      vf:{ cat:"word", tag:"A curse on his head", tr:"May the gods keep them in store for his own head and for his son-in-law!",
        what:"<i>reservent</i> is a jussive subjunctive: a prayer, or a curse. <i>capiti ipsius</i>, 'for his own head', is the language of Roman cursing; <i>generique</i> is literally 'and for his son-in-law', but Virgil seems to mean his family generally (Mezentius' son Lausus dies in Book 10). The formula asks the gods to give the tyrant what he gave others.",
        effect:"Evander's calm narration breaks into a prayer for vengeance, which shows his own feeling and invites Aeneas to share it. The reader is reminded that the gods are the tyrant's enemies; Virgil elsewhere calls him <i>contemptor divum</i>, 'despiser of the gods'.",
        ex:{ style:"The narrative breaks into a curse, <i>di capiti ipsius generique reservent!</i>, 'may the gods keep such things in store for his own head and for his son-in-law!': the jussive subjunctive turns Evander from narrator into prosecutor, and the formula of the curse, with its exclamation, makes the reader share his wish to see the tyrant punished.",
             content:"Evander prays that the gods will punish Mezentius and his family (literally his son-in-law) in the same way as he punished others.",
             essay:"Evander calls down the gods on Mezentius' head, and Virgil elsewhere names him 'despiser of the gods', so the villain is defined partly by his relationship to heaven, the reverse of Aeneas' <i>pietas</i>." } },
      vg:{ cat:"order", tag:"Dead against living across the line", tr:"What is more, he even used to join dead bodies to living ones",
        what:"<i>mortua</i> is the first word of line 8 and <i>vivis</i> the last, so the line is framed by the two opposites; <i>corpora</i> and <i>iungebat</i> sit between them. <i>quin etiam</i>, 'what is more, indeed he even', marks a climax after the general charges. <i>iungebat</i> is imperfect: a repeated practice, not one atrocity.",
        effect:"The line itself binds the dead to the living as Mezentius did. The reader is made to feel the joining physically through the word order, and the imperfect tense means it happened again and again.",
        ex:{ style:"Virgil places <i>mortua</i> at the start of line 8 and <i>vivis</i> at its end, 'dead ... living', so that the line itself binds the dead to the living as Mezentius did, and the imperfect <i>iungebat</i>, 'used to join', tells the reader this was a repeated practice rather than a single atrocity.",
             content:"Mezentius used to tie dead bodies to living people.",
             essay:"Mezentius' signature crime, binding the living to corpses, is a torture with no military purpose, and it is what separates a villain from a merely harsh king: cruelty for its own sake." } },
      vh:{ cat:"sound", tag:"Hand to hand, face to face", tr:"fitting hands to hands and faces to faces",
        what:"<i>manibusque manus atque oribus ora</i>: each noun appears twice in different cases (polyptoton), dative then accusative, and the pairs are linked by <i>-que ... atque</i> (polysyndeton). <i>componens</i>, 'arranging, fitting together', is the careful verb of a craftsman or an undertaker laying out a body.",
        effect:"The reader hears the corpse and the victim being matched part by part; the repetition enacts the pairing. The calm, technical <i>componens</i> is worse than any shriek: the tyrant is precise about his cruelty.",
        ex:{ style:"The polyptoton of <i>manibusque manus atque oribus ora</i>, 'hands to hands and faces to faces', repeats each noun in two cases so that the reader hears the corpse and the living victim being matched limb by limb, and the participle <i>componens</i>, 'fitting together', a craftsman's word, makes the cruelty deliberate and careful.",
             content:"He fitted the corpses to the living victims hand against hand and face against face.",
             essay:"" } },
      vi:{ cat:"word", tag:"A flat aside", tr:"a kind of torture",
        what:"<i>tormenti genus</i> is an accusative in loose apposition to the whole action, two words dropped in as if classifying it. <i>tormentum</i> is the technical word for torture, especially of slaves.",
        effect:"The understatement is chilling. Evander sounds as if he is filing the practice under a heading, and the calm makes the reader supply the horror. It also implies that this was a system, one 'kind' among others.",
        ex:{ style:"Virgil drops in the two-word phrase <i>tormenti genus</i>, 'a kind of torture', as a flat aside, and the understatement, which sounds like a category rather than a cry of horror, leaves the reader to supply the disgust that Evander withholds.",
             content:"Evander describes what Mezentius did as a form of torture.",
             essay:"" } },
      vj:{ cat:"word", tag:"Gore and rot", tr:"streaming with gore and putrefaction",
        what:"Two nouns for decay, <i>sanies</i> (the discharge from a wound or corpse) and <i>tabum</i> (putrid matter), joined by <i>-que</i>, and the present participle <i>fluentes</i>, 'streaming', which agrees with the victims (<i>eos</i> understood). The living are already leaking the matter of the dead.",
        effect:"The vocabulary is physical and revolting, chosen to make the reader smell the scene. <i>fluentes</i> makes the corruption an ongoing process: the victim is being turned into a corpse while still alive.",
        ex:{ style:"The words <i>sanie taboque fluentes</i>, 'streaming with gore and putrefaction', pile up two nouns for decaying matter and a present participle of flowing, so that the living victims are described as already leaking the substance of the corpses they are tied to, and the reader is made to feel the physical horror rather than merely hear of it.",
             content:"The victims were covered with, and dripping, the gore and rotting matter from the corpses.",
             essay:"" } },
      vk:{ cat:"order", tag:"A wretched embrace, a long death", tr:"in that wretched embrace he killed them like this by a lingering death",
        what:"<i>complexu in misero</i> and <i>longa ... morte</i> make a chiasmus (noun-adjective, adjective-noun) with <i>sic</i> at the centre. <i>complexus</i>, 'embrace', is a word of love and greeting, here used of a corpse's grip. <i>longa morte</i> is an ablative of manner; <i>necabat</i>, imperfect, again marks repeated killing.",
        effect:"Using the vocabulary of love for the torture is the cruellest touch: the victim dies in an embrace. The chiasmus wraps the death around the embrace as the corpse wraps the living man, and <i>longa</i> stresses that the point was slowness. The main verb <i>necabat</i> is held back to the very end of the sentence.",
        ex:{ style:"In <i>complexu in misero longa sic morte necabat</i>, 'in that wretched embrace he killed them by a lingering death', Virgil uses <i>complexus</i>, a word for a lover's or a friend's embrace, of the corpse's grip on the living, and the chiasmus of <i>complexu ... misero longa ... morte</i> folds the death around the embrace as the corpse enfolds the victim, with the main verb <i>necabat</i> withheld to the end.",
             content:"The victims died a slow (lingering) death in the horrible embrace of the corpse.",
             essay:"Virgil borrows the word for a loving embrace to describe Mezentius' torture, and that inversion of something human into something monstrous is how the poem makes us judge him a villain rather than simply a hard ruler." } },
      vl:{ cat:"structure", tag:"The turn: worn out, at last", tr:"But at last the citizens, worn out",
        what:"<i>at</i> is Virgil's word for a change of direction. <i>fessi tandem</i>, 'worn out, at last', tells us the citizens had endured for a long time before acting. Line 12 is spondaic, matching their long suffering, and from here the verbs are historic presents (<i>circumsistunt, obtruncant, iactant</i>) after the imperfects of the torture.",
        effect:"The revolt feels earned: they did not rebel lightly. The shift from imperfect to present tense makes the uprising happen now, in front of the reader, after the long slow horror of the previous lines.",
        ex:{ style:"The narrative turns on <i>at fessi tandem cives</i>, 'but at last the citizens, worn out': <i>tandem</i> and <i>fessi</i> show how long the people endured before acting, so that their violence feels justified, and Virgil switches from the imperfect tense of the tortures to historic presents, <i>circumsistunt ... obtruncant ... iactant</i>, so that the uprising happens before the reader's eyes.",
             content:"The citizens, exhausted by his cruelty, finally took up arms against Mezentius.",
             essay:"Virgil is careful to say the citizens rose 'at last, worn out', so that the revolt against the villain is presented as long-suffering justice rather than rebellion, and their fury in line 17 is called 'justified'." } },
      vm:{ cat:"sound", tag:"f- alliteration and the second 'unspeakable'", tr:"raging in his unspeakable crimes",
        what:"<i>infanda furentem</i>: <i>infanda</i> is a neuter plural accusative used adverbially, 'unspeakably' or 'in unspeakable deeds'; <i>furentem</i>, 'raging', is the word for madness. The repeated <i>f</i> (<i>fessi ... infanda furentem ... fastigia</i>) runs across the sentence, and <i>infanda</i> repeats <i>infandas</i> from line 6.",
        effect:"The alliteration gives the lines a harsh, spitting sound as the violence starts. Calling him <i>furentem</i>, mad, makes the citizens' action a cure rather than a crime, and the echo of <i>infandas</i> reminds the reader of what they are avenging.",
        ex:{ style:"Virgil describes Mezentius as <i>infanda furentem</i>, 'raging in his unspeakable crimes', and the <i>f</i>-alliteration that runs through <i>fessi ... infanda furentem ... fastigia</i> gives the uprising a harsh sound, while the repetition of <i>infanda</i> from line 6 reminds the reader exactly what the citizens are avenging.",
             content:"Mezentius was raging (behaving like a madman) in his unspeakable crimes.",
             essay:"" } },
      vn:{ cat:"structure", tag:"Surround, cut down, hurl fire", tr:"they surround both the man himself and his house, they cut down his companions, they hurl fire onto the roof-tops",
        what:"Three historic-present verbs, each shorter and harder than the last, with no connecting word between the clauses (asyndeton): <i>circumsistunt ... obtruncant ... iactant</i>. Inside the first, <i>ipsumque domumque</i> uses double <i>-que</i> (polysyndeton) to wrap the man and his house together. The last clause is a chiasmus, verb-object-object-verb across <i>obtruncant socios, ignem ... iactant</i>. <i>fastigia</i> are the gables of the palace roof.",
        effect:"The asyndeton drives the rhythm faster and faster; the reader feels the mob's momentum. The double <i>-que</i> shows the whole household engulfed, and the fire on the roof is the classic image of a tyrant's fall.",
        ex:{ style:"The uprising comes in a tricolon of historic presents without connectives, <i>circumsistunt ... obtruncant ... iactant</i>, 'they surround, they cut down, they hurl', so that the asyndeton drives the violence faster with each verb, and the double <i>-que</i> of <i>ipsumque domumque</i>, 'both the man himself and his house', wraps the tyrant and his palace together in the people's revenge.",
             content:"The citizens surrounded Mezentius and his palace, killed his companions and threw fire onto the roofs.",
             essay:"" } },
      vo:{ cat:"order", tag:"Escape into the enemy's arms", tr:"fled for refuge and was defended by the arms of Turnus, his host",
        what:"<i>confugere</i> and <i>defendier</i> are historic infinitives (used for a main verb), and <i>defendier</i> is an archaic form of the passive infinitive, giving the line an old, epic ring. The word order encloses: <i>Turni ... hospitis</i> surrounds <i>defendier</i>, so the verb of protecting is itself protected by Turnus. <i>hospitis</i>, 'host', names the sacred bond of hospitality.",
        effect:"Mezentius survives, which is the point of the whole speech: the Etruscans still want him. The enclosing order shows the protection physically. And the reader is told who protects tyrants: Turnus, Aeneas' enemy, so the villain of Etruria joins the case against the villain of the war.",
        ex:{ style:"Virgil uses historic infinitives, <i>confugere et Turni defendier hospitis armis</i>, 'fled for refuge and was defended by the arms of Turnus his host', with the archaic form <i>defendier</i> lending an epic gravity, and the enclosing word order, <i>Turni ... hospitis</i> wrapped around <i>defendier</i>, makes the verb of protection itself protected, as Mezentius is by Turnus.",
             content:"Mezentius escaped during the slaughter into the land of the Rutulians, where Turnus received him as a guest and protected him with his army.",
             essay:"The villain is sheltered by Turnus, Aeneas' opponent, so that Virgil ties the tyrant of Caere to the enemy of Rome's destiny, and the hero's war against Turnus becomes also a war against Mezentius' kind of kingship." } },
      vp:{ cat:"word", tag:"Justified fury", tr:"all Etruria has risen up in justified fury",
        what:"<i>furiis ... iustis</i> is an ablative of manner, and the adjective <i>iustis</i> is held to the end of the line, separated from its noun (enclosing <i>surrexit Etruria</i>). <i>furiae</i> are usually the madness of the avenging spirits; here Virgil calls the fury 'just'. <i>omnis ... Etruria</i>: the whole country, personified, rises.",
        effect:"Virgil puts the word of justice on the rebels' side, which settles the reader's judgement: rage against Mezentius is righteous. Delaying <i>iustis</i> to the line's end makes it the verdict on the whole passage.",
        ex:{ style:"Virgil describes Etruria as rising <i>furiis ... iustis</i>, 'in justified fury', and by holding the adjective <i>iustis</i> to the end of the line, separated from its noun, he makes 'just' the final word on the people's rage, so that the reader is told that anger against Mezentius is righteous.",
             content:"The whole of Etruria rose up against Mezentius in justified anger.",
             essay:"Virgil calls the Etruscans' fury against Mezentius 'just', a rare thing for a poet to say of a mob, and it shows how completely the passage is designed to make the reader take sides against him." } },
      vq:{ cat:"word", tag:"'They demand the king for punishment'", tr:"they demand the king for punishment with war on the spot",
        what:"<i>regem</i>, 'the king', is placed first: the Etruscans want him back, and the word they use for him is the title he abused. <i>ad supplicium</i>, 'for punishment' (the word for execution); <i>praesenti Marte</i> is an ablative absolute with Mars standing for war (metonymy), 'with war at hand', i.e. they will fight for him now. <i>reposcunt</i>, 'demand back', is a historic present.",
        effect:"The passage ends on the threat of immediate war, which is exactly Evander's point: here is an army ready to march, and it needs a leader. The tone shifts from horror to action, and Aeneas, and the reader, are meant to feel the pull.",
        ex:{ style:"The passage ends on action: <i>regem ad supplicium praesenti Marte reposcunt</i>, 'they demand the king for punishment with war on the spot'. Placing <i>regem</i> first makes the tyrant's title the object of the people's demand, the personification <i>praesenti Marte</i> makes war itself present, and the historic present <i>reposcunt</i> leaves the reader with an army poised to move, which is precisely what Evander wants Aeneas to see.",
             content:"The Etruscans are demanding that Mezentius be handed over to them for execution, and are ready to go to war immediately to get him.",
             essay:"The Etruscans' demand that their former king be handed over 'for punishment' is where the villain's story meets the hero's: Aeneas will be the foreign leader the prophecy requires, and killing Mezentius in Book 10 becomes part of his mission." } }
    },
    questions:[
      { id:"q1", marks:2, type:"content", q:"Lines 1–3 (<i>haud ... Etruscis</i>): what are we told about the people who founded the city of Agylla? Give <b>two</b> details.",
        model:"They were Lydians (had come from Lydia); they were famous in war; they settled on the Etruscan ridges (hills); they did so long ago (<i>quondam</i>).",
        scheme:["One mark for each of any two details from lines 1–3.","'Etruscans' alone does not earn the 'Lydian' mark, but 'came from Lydia' does."] },
      { id:"q2", marks:2, type:"latin", q:"Lines 4–5 (<i>hanc ... armis</i>): pick out and translate the Latin adjective which describes the kind of power Mezentius exercised.",
        model:"<i>superbo</i> — 'arrogant' / 'proud' / 'tyrannical' (rule). (<i>saevis</i>, 'cruel', describes his arms rather than his power, but is acceptable if translated correctly.)",
        scheme:["One mark for the Latin word.","One mark for its translation."] },
      { id:"q3", marks:3, type:"content", q:"Lines 8–11 (<i>mortua ... necabat</i>): describe the torture that Mezentius used. Give <b>three</b> details.",
        model:"He tied dead bodies to living people; fitting hand to hand and face to face; the victims were covered in gore and putrefaction from the corpses; they died a slow, lingering death in this embrace.",
        scheme:["One mark for each of any three details taken from lines 8–11.","'He tortured people' is the question restated and earns nothing on its own."] },
      { id:"q4", marks:8, type:"style", q:"Lines 6–11 (<i>quid memorem ... necabat</i>): how does Virgil's language make Mezentius' cruelty horrifying? Make <b>four</b> points and refer closely to the Latin.",
        model:"<b>1.</b> The rhetorical question with anaphora, <i>quid memorem infandas caedes, quid facta tyranni / effera?</i>, 'why should I recount the unspeakable slaughters, why the savage deeds of the tyrant?', pretends the crimes are too terrible to tell before telling them, and the enjambment that isolates <i>effera</i>, 'bestial', at the start of line 7 leaves a single word of judgement hanging: the man is an animal. <b>2.</b> <i>mortua</i> opens line 8 and <i>vivis</i> closes it, 'dead ... living', so the line itself binds the dead to the living as Mezentius does, and <i>quin etiam</i> marks this as the climax of a list of horrors. <b>3.</b> The polyptoton <i>manibusque manus atque oribus ora</i>, 'hands to hands and faces to faces', repeats each noun in two cases so the reader hears the corpse and the victim fitted together limb by limb, and the participle <i>componens</i>, 'arranging', is a craftsman's word that makes the cruelty deliberate and careful. <b>4.</b> The vocabulary of decay, <i>sanie taboque fluentes</i>, 'streaming with gore and putrefaction', gives two words for rotting matter and a participle of flowing, so the living victims are already leaking the substance of the dead; and <i>complexu in misero</i>, 'in that wretched embrace', takes a word for a loving embrace and uses it of a corpse's grip, while <i>longa ... morte</i> stresses that the point of the torture was its slowness. (Also creditable: the flat aside <i>tormenti genus</i>; the imperfects <i>iungebat</i> and <i>necabat</i> showing repeated practice; the chiasmus of line 11; <i>necabat</i> withheld to the end.)",
        scheme:["Two marks per point: Latin quoted + what Virgil does + effect on the reader, linked to 'horrifying'.","Four separate points; naming a device without its effect scores one at most.","Stay inside lines 6–11: the uprising in lines 12–14 is not part of this question."] },
      { id:"q5", marks:2, type:"interp", q:"Lines 12–18 (<i>at fessi ... reposcunt</i>): explain <b>one</b> way in which Virgil makes the reader feel that the Etruscans were right to rise against Mezentius.",
        model:"Any one of, with explanation: he says the citizens were <i>fessi tandem</i>, worn out and acting only at last, so they had endured for a long time; he calls their fury <i>iustis</i>, justified; he calls Mezentius <i>furentem</i>, raging like a madman, so stopping him was a necessity; he shows the tyrant sheltered by Turnus, the enemy, so the Etruscans' demand for punishment is aligned with Aeneas' cause.",
        scheme:["1 mark for identifying a relevant detail from lines 12–18.","1 mark for explaining how it makes the reader take the Etruscans' side. Latin is not required but a detail must be given."] }
    ]
  }

  /* ---------- Bringing it together: one paragraph across the booklet ---------- */
  synthesis:{
    title:"Bringing the three passages together",
    intro:"The 16-mark essay will ask something like <i>'A villain is simply a hero seen from the wrong side.' How far do the texts you have studied support this view?</i> or <i>'Roman writers are more interested in villains than in heroes.' Do you agree?</i> You will need at least four texts or pictures in the exam. For now, practise one paragraph that uses Sejanus and Mezentius together. No Latin is needed; in the essay it earns nothing.",
    q:"Write <b>one paragraph</b> (about 120–150 words) answering: <i>Do Tacitus and Virgil make their villains villainous in the same way?</i> Use both Sejanus and Mezentius, refer to specific details in English, and end with a sentence that answers the question.",
    marks:6,
    model:"Tacitus and Virgil make their villains villainous by opposite methods. Virgil's Mezentius is condemned by his deeds: Evander describes him tying living men to corpses, face to face, until they died a slow death in the corpse's embrace, and the poem calls the people's fury against him 'just'. There is no need to interpret; the horror does the work. Tacitus' Sejanus is condemned by interpretation. His only deed in the prescribed text is heroic, shielding the emperor with his own body when the cave roof fell, but Tacitus has already told us in the character sketch that his modesty was 'put on', that inside he craved supreme power, and that even his hard work was harmful because it was feigned for a throne; so the reader is taught to see the rescue as an investment that bought Tiberius' trust. Both writers leave no doubt of the verdict, but Virgil shows a monster and Tacitus unmasks a performer, and that difference is also the difference between epic and history.",
    scheme:["Top marks: a clear answer to the question; specific detail from both passages; the detail is explained, not listed; a concluding sentence that returns to the question.","Middle: both villains used, but the comparison is asserted rather than shown, or one side is much thinner.","Low: description of one villain, or details with no link to the question."]
  },

  /* ---------- Guidance panel (booklet 1 only) ---------- */
  guidance:{
    title:"Answering the short questions: what the examiners reward",
    intro:"Everything below comes from the Eduqas mark schemes, the examiners' reports and the board's marking guidance. Read it once now, and again before each set of questions.",
    items:[
      { h:"Read the line reference, and stay inside it",
        p:"Every question names the lines it is about (<i>lines 15–17</i>). The examiners say that every year 'excellent, perceptive answers' earn nothing because they use material from outside those lines. Before you write, put a finger on the first word and the last word of the reference." },
      { h:"Answer in English unless the question asks for Latin",
        p:"The instruction at the front of the paper is 'answer in English'. Quote Latin only when the question says <i>refer to the Latin</i> or <i>pick out the Latin word</i>. In a plain content question, Latin on its own without a translation earns nothing." },
      { h:"Marks are points: count them",
        p:"In content questions there is usually one mark for each Latin word or short phrase that carries a fact. If the question is worth 3, give three separate details; if it says <i>give two</i>, give two. Extra correct details do no harm on a 'give details' question, but a wrong one among them can lose a mark on some question types, so do not pad." },
      { h:"'Pick out and translate'",
        p:"Copy the Latin word exactly as it is printed, then translate it. Two marks: one for the right word, one for its meaning. If the word is a comparative or superlative, the second mark is for getting that degree into the English ('more', '-est')." },
      { h:"Style questions (4, 6 or 8 marks): quote, translate, explain, link",
        p:"These are the questions that separate the top grades. The examiners' formula is: <b>quote the Latin, translate it, say what the writer has done with it, and link it to the terms of the question</b>. Naming a technique (alliteration, chiasmus) is not essential and earns nothing by itself; 'the author emphasises these words' is not enough either. Ask instead: why these words? what do they add? do they link back to something else? Aim for one clear point per two marks: three points for 6 marks, four for 8. Each point on a separate line. Word choice is a valid point: why did the author choose that particular word?" },
      { h:"'What impression...?', 'What do you think...?', 'Explain why...'",
        p:"These are evaluation questions (AO3). A fact alone gains nothing; the explanation is what earns the mark. Give the impression or the judgement, then the reason, and tie the reason to the lines named. Where the question says <i>give one reason</i>, one well-explained reason beats three vague ones." },
      { h:"The 16-mark essay",
        p:"You must refer to at least <b>four</b> of the texts and pictures in the Resource Booklet, or you cannot get above Band 3 for knowledge. Latin quotation is 'out of place' in the essay and earns nothing; refer to details in English. Every example must be linked to the question: what does it show about the hero, the villain, the statement you were given? A counter-argument helps ('but...'), a brief conclusion always helps, and a long introduction that repeats the question, or a conclusion that repeats the essay, wastes time. In the exam booklet the seven texts are three heroes (Horatius, Augustus, Camilla) and four villains (Antony, Sempronia, Sejanus, Mezentius): learn which is which." },
      { h:"In this booklet",
        p:"Each note you open gives you three sentences: one for a style question, one for a content or impression question, and one for the essay. They are models of the shape, not lines to learn. When you answer the questions at the end of each passage, write your answer first, then press <i>Reveal</i> to see the model and mark yourself. Your marks and your answers are saved for your teacher." }
    ]
  }
};

</script>
<script>
/* ===================== helpers ===================== */
const $=id=>document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function stripHtml(s){ const d=document.createElement('div'); d.innerHTML=String(s||'').replace(/<br\s*\/?>/gi,' '); return (d.textContent||'').replace(/\s+/g,' ').trim(); }
const CATNAME={ order:"Word order & position", sound:"Sound & rhythm", structure:"Sentence shape & syntax", word:"Choice of words", context:"Fact & context (AO2)" };
const TYPENAME={ content:"Content", latin:"Pick out the Latin", style:"Style", interp:"Impression / judgement", essay:"Essay paragraph" };

/* ===================== state & cloud ===================== */
const CLOUD={ endpoint:"https://vestigia-store.mrbeasley930.workers.dev", token:"vp_8c7103b52959b06cb55526bf", book:BOOKLET.book };
const LESSON={ id:BOOKLET.id, title:"Booklet "+BOOKLET.num+" — "+stripHtml(BOOKLET.title)+": "+stripHtml(BOOKLET.subtitle) };
const FIXEDCLS="TUTOR";
let IDENTITY=null;
let state={ answers:{}, marks:{}, revealed:{}, read:{}, pnotes:{}, rag:"", opened:{} };
function userKey(){ return IDENTITY?(IDENTITY.cls+"::"+IDENTITY.cand):"anon"; }
function fullKey(){ return CLOUD.book+"::"+userKey(); }
function storeKey(){ return "hv_booklet_"+BOOKLET.num+"_"+(IDENTITY?(IDENTITY.cls+"_"+IDENTITY.cand):"default"); }
function safeGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function safeSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
const CloudStore={
  async pull(){ if(!IDENTITY) return {ok:false};
    try{ const r=await fetch(CLOUD.endpoint+"?key="+encodeURIComponent(fullKey()),{headers:{"x-vestigia-token":CLOUD.token}});
      if(r.status===404) return {ok:true,data:null}; if(!r.ok) return {ok:false};
      const j=await r.json(); return {ok:true,data:(j&&j.data)?j.data:null}; }catch(e){ return {ok:false}; } },
  async push(blob){ if(!IDENTITY) return false;
    try{ const r=await fetch(CLOUD.endpoint,{method:"POST",headers:{"x-vestigia-token":CLOUD.token,"Content-Type":"application/json"},
      body:JSON.stringify({key:fullKey(),cls:IDENTITY.cls,cand:IDENTITY.cand,book:CLOUD.book,data:blob,savedAt:new Date().toISOString()})}); return r.ok; }catch(e){ return false; } }
};
function mergeState(remote){ if(!remote) return; for(const k of ['answers','marks','revealed','read','pnotes','opened']){ state[k]=Object.assign({},state[k]||{},remote[k]||{}); } if(remote.rag) state.rag=remote.rag; }
function loadLocal(){ try{ const s=JSON.parse(safeGet(storeKey())||"null"); if(s) mergeState(s); }catch(e){} }
let _mt=null;
function save(){ safeSet(storeKey(),JSON.stringify(state)); if(!IDENTITY) return; setSync("saving"); clearTimeout(_mt);
  _mt=setTimeout(async()=>{ const ok=await CloudStore.push(cloudSummary()); setSync(ok?"cloud":"offline"); },700); }
function setSync(s){ const el=$('savestatus'); if(!el) return;
  const map={ saving:["saving…","#e2cb92"], cloud:["✓ saved to class store","#8fd8a6"], offline:["saved on this device — will sync when online","#f0c766"], device:["saved on this device","#8fd8a6"] };
  const m=map[s]||map.device; el.textContent=m[0]; el.style.color=m[1]; }

/* ===================== summary for the tracker ===================== */
function allQ(){ const out=[]; BOOKLET.passages.forEach(p=>p.questions.forEach(q=>out.push({pid:p.id,q,key:p.id+'_'+q.id,sec:p.short}))); out.push({pid:'syn',q:{id:'syn',marks:BOOKLET.synthesis.marks,type:'essay',q:BOOKLET.synthesis.q,model:BOOKLET.synthesis.model,scheme:BOOKLET.synthesis.scheme},key:'syn_syn',sec:BOOKLET.synthesis.title}); return out; }
function cloudSummary(){
  const sections={}; let got=0,max=0,answered=0,total=0;
  const detail=[];
  const groups={}; BOOKLET.passages.forEach(p=>groups[p.id]={name:p.short,answered:0,of:p.questions.length,marks:0,max:0,notesRead:Object.keys(p.notes).filter(k=>state.read[p.id+'_'+k]).length,notesTotal:Object.keys(p.notes).length});
  groups.syn={name:"Together",answered:0,of:1,marks:0,max:0,notesRead:0,notesTotal:0};
  allQ().forEach(it=>{ const a=(state.answers[it.key]||'').trim(); const mk=state.marks[it.key]; const g=groups[it.pid];
    total++; g.max+=it.q.marks; max+=it.q.marks; if(a){ answered++; g.answered++; } if(mk!=null){ g.marks+=mk; got+=mk; }
    detail.push({ id:it.key, s:it.pid, sec:it.sec, type:it.q.type, marks:it.q.marks, lat:stripHtml(it.q.q), a:a, m:stripHtml(it.q.model), mk:(mk==null?null:mk), revealed:state.revealed[it.key]||null, opened:state.opened[it.key]||null }); });
  for(const k in groups){ sections[k]={pts:groups[k].marks,max:groups[k].max,answered:groups[k].answered,of:groups[k].of,notesRead:groups[k].notesRead,notesTotal:groups[k].notesTotal,name:groups[k].name}; }
  return { name:(IDENTITY?IDENTITY.cand:''), lesson:LESSON.id, title:LESSON.title, book:CLOUD.book, booklet:BOOKLET.num,
    coreGot:got, coreTot:max, answered:answered, total:total, rag:(state.rag||''), pnotes:state.pnotes||{},
    sections:sections, detail:detail, text:summaryText(groups,got,max,answered,total), savedAt:new Date().toISOString(), state:state };
}
function summaryText(g,got,max,answered,total){ let out=LESSON.title+"\n"; for(const k in g){ out+="  "+g[k].name+": "+g[k].answered+"/"+g[k].of+" answered, self-marked "+g[k].marks+"/"+g[k].max+(g[k].notesTotal?(", notes read "+g[k].notesRead+"/"+g[k].notesTotal):"")+"\n"; }
  out+="Total: "+answered+"/"+total+" answered, "+got+"/"+max+" self-marked\n"; if(state.rag) out+="Confidence: "+state.rag+"\n"; return out; }

/* ===================== render ===================== */
function renderHeader(){ $('h-series').innerHTML=BOOKLET.series; $('h-title').innerHTML=BOOKLET.title; $('h-sub').innerHTML=BOOKLET.subtitle; $('h-strap').innerHTML=BOOKLET.strap; $('h-bookno').textContent="BOOKLET "+BOOKLET.num; document.title=stripHtml("Heroes B"+BOOKLET.num+" — "+BOOKLET.title+": "+BOOKLET.subtitle); $('foot').innerHTML="Heroes and Villains · Booklet "+BOOKLET.num+" · Mr Beasley · saves to the class store as <b>"+esc(CLOUD.book)+"</b>"; }

const TABS=[{id:'guide',label:'Guide'}].concat(BOOKLET.passages.map(p=>({id:p.id,label:p.short}))).concat([{id:'syn',label:'Together'}]);
function renderTabs(){ $('tabs').innerHTML=TABS.map(t=>'<button class="tab" data-tab="'+t.id+'" onclick="go(\''+t.id+'\')">'+t.label+'<span class="done" id="tabdone-'+t.id+'"></span></button>').join(''); }
function go(id){ document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active')); document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  const p=$('p-'+id); if(p) p.classList.add('active'); const b=document.querySelector('.tab[data-tab="'+id+'"]'); if(b) b.classList.add('active'); window.scrollTo({top:0,behavior:'smooth'}); closeSheet(); }

function latHtml(pid,lat,ln){
  const start=parseInt(ln)||0; let k=0;
  let s=lat.replace(/\[\[(\w+)\|([\s\S]*?)\]\]/g,(m,id,txt)=>{ const n=BOOKLET.passages.find(p=>p.id===pid).notes[id]; const cat=n?n.cat:'word'; const rk=state.read[pid+'_'+id]?' read':''; return '<mark class="hl '+cat+rk+'" data-note="'+id+'" data-pid="'+pid+'" tabindex="0" role="button">'+txt+'</mark>'; });
  s=s.replace(/ \/ /g,()=>{ k++; return '<span class="lb" data-n="'+(start+k)+'"></span>'; });
  return s;
}
function renderGuide(){
  const g=BOOKLET.guidance;
  let h='<section class="panel" id="p-guide"><div class="card">';
  h+='<div class="ref">'+esc(stripHtml(BOOKLET.series))+'</div><h2>How this booklet works</h2>';
  h+='<p>Three passages, each set out with the Latin on the left and a translation on the right. The coloured phrases in the Latin are the places where a question can be asked: tap one and its note opens beside the text, with what the writer did, the effect, and three model sentences showing how that point would be written in each kind of exam question. At the end of each passage there are exam-style questions. Answer, press <b>Reveal</b>, mark yourself. Everything saves to the class store and follows you to any device.</p>';
  h+='<div class="legend">'+Object.keys(CATNAME).map(c=>'<span class="lg"><span class="sw '+c+'"></span>'+CATNAME[c]+'</span>').join('')+'</div>';
  h+='<div class="themebox">'+BOOKLET.themeNote+'</div>';
  h+='</div>';
  if(g){ h+='<div class="card"><h2>'+g.title+'</h2><p class="small">'+g.intro+'</p>'+g.items.map(it=>'<div class="gitem"><h4>'+it.h+'</h4><p>'+it.p+'</p></div>').join('')+'</div>'; }
  h+='</section>'; return h;
}
function renderPassage(p){
  let h='<section class="panel" id="p-'+p.id+'"><div class="card">';
  h+='<div class="ref">'+p.author+' · '+p.work+' · '+p.lines+'</div><h2>'+p.heading+'</h2>';
  h+='<p>'+p.intro+'</p>';
  if(p.facts&&p.facts.length){ h+='<details class="facts"><summary>The facts the examiner can ask for</summary><table>'+p.facts.map(f=>'<tr><th>'+f[0]+'</th><td>'+f[1]+'</td></tr>').join('')+'</table></details>'; }
  h+='<div class="progress"><span>Notes opened: <b id="nr-'+p.id+'">0</b>/'+Object.keys(p.notes).length+'</span><span>Questions answered: <b id="qa-'+p.id+'">0</b>/'+p.questions.length+'</span><span>Self-marked: <b id="qm-'+p.id+'">0</b>/'+p.questions.reduce((a,q)=>a+q.marks,0)+'</span></div>';
  h+='<div class="legend">'+Object.keys(CATNAME).map(c=>'<span class="lg"><span class="sw '+c+'"></span>'+CATNAME[c]+'</span>').join('')+'<span class="note">Tap a phrase to open its note.</span></div>';
  h+='<div class="textwrap"><div class="text"><div class="thead"><span>Line</span><span>Latin</span><span>English</span></div>';
  h+=p.rows.map(r=>'<div class="row"><div class="ln">'+r.ln+'</div><div class="lat">'+latHtml(p.id,r.lat,r.ln)+'</div><div class="en">'+r.en+'</div></div>').join('');
  h+='</div>';
  h+='<aside class="npanel" id="np-'+p.id+'"><div class="nhead"><b>Note</b><span class="cnt" id="ncnt-'+p.id+'"></span><button class="btn nclose" onclick="closeSheet()">Close</button></div><div class="nbody" id="nb-'+p.id+'"><p class="empty">Tap any coloured phrase in the Latin to read its note here.</p></div></aside>';
  h+='</div>';
  h+='<h3>Exam-style questions on this passage</h3><p class="small">Write your answer first. Then reveal the model, compare, and give yourself a mark. Stay inside the lines each question names.</p>';
  h+=p.questions.map((q,i)=>renderQ(p.id,q,i+1)).join('');
  h+='<h3>My notes on this passage</h3><textarea data-pnotes="'+p.id+'" placeholder="Anything from the session: questions, things to check, phrases to learn..." style="min-height:80px"></textarea>';
  h+='</div></section>'; return h;
}
function renderQ(pid,q,n){
  const key=pid+'_'+q.id;
  let h='<div class="q" id="q-'+key+'"><div class="qtop"><span class="qn">'+(pid==='syn'?'':(n+'. '))+'</span><span class="qm">'+q.marks+' mark'+(q.marks===1?'':'s')+'</span><span class="qt">'+(TYPENAME[q.type]||q.type)+'</span></div>';
  h+='<div class="qtext">'+q.q+'</div>';
  h+='<textarea data-q="'+key+'" placeholder="'+(q.type==='style'?'Point 1: quote the Latin, translate it, say what the writer does, give the effect...':(q.type==='latin'?'Latin word — translation':'Your answer, in English...'))+'"></textarea>';
  h+='<div class="qbar"><button class="btn rev" onclick="reveal(\''+key+'\')" id="rv-'+key+'">Reveal model answer</button><span class="wc" id="wc-'+key+'"></span><span class="unlock" id="ul-'+key+'" style="display:none" onclick="unlock(\''+key+'\')">unlock to improve my answer</span></div>';
  h+='<div class="model" id="md-'+key+'"><div class="mh">Model answer</div><div class="mtext">'+q.model+'</div>';
  if(q.scheme&&q.scheme.length){ h+='<div class="mh">How it is marked</div><ul>'+q.scheme.map(s=>'<li>'+s+'</li>').join('')+'</ul>'; }
  h+='<div class="selfmark"><span>My mark:</span>'+Array.from({length:q.marks+1},(_,i)=>'<button class="mk" data-key="'+key+'" data-v="'+i+'" onclick="setMark(\''+key+'\','+i+')">'+i+'</button>').join('')+'<span class="small" id="mkmsg-'+key+'"></span></div>';
  h+='</div></div>'; return h;
}
function renderSyn(){
  const s=BOOKLET.synthesis;
  let h='<section class="panel" id="p-syn"><div class="card"><div class="ref">Across the booklet</div><h2>'+s.title+'</h2><p>'+s.intro+'</p>';
  h+=renderQ('syn',{id:'syn',marks:s.marks,type:'essay',q:s.q,model:s.model,scheme:s.scheme},1);
  h+='<h3>How confident do you feel about these three passages?</h3><div class="rag"><button class="r" onclick="setRag(\'Red\')">Red — not yet</button><button class="a" onclick="setRag(\'Amber\')">Amber — getting there</button><button class="g" onclick="setRag(\'Green\')">Green — confident</button></div>';
  h+='<p class="note" style="margin-top:12px">Your answers, marks and notes are saved automatically. Your teacher can see them in the tracker.</p>';
  h+='</div></section>'; return h;
}
function renderAll(){ renderHeader(); renderTabs(); $('panels').innerHTML=renderGuide()+BOOKLET.passages.map(renderPassage).join('')+renderSyn(); bind(); restoreAll(); go('guide'); }

/* ===================== notes ===================== */
let CUR={};
function bind(){
  document.querySelectorAll('mark.hl').forEach(m=>{ m.addEventListener('click',()=>openNote(m.dataset.pid,m.dataset.note)); m.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openNote(m.dataset.pid,m.dataset.note);} }); });
  document.querySelectorAll('textarea[data-q]').forEach(t=>{ t.addEventListener('input',()=>{ state.answers[t.dataset.q]=t.value; if(!state.opened[t.dataset.q]) state.opened[t.dataset.q]=new Date().toISOString(); wc(t.dataset.q); save(); updateProgress(); }); });
  document.querySelectorAll('textarea[data-pnotes]').forEach(t=>{ t.addEventListener('input',()=>{ state.pnotes[t.dataset.pnotes]=t.value; save(); }); });
}
function noteOrder(pid){ return Object.keys(BOOKLET.passages.find(p=>p.id===pid).notes); }
function openNote(pid,id){
  const p=BOOKLET.passages.find(x=>x.id===pid); const n=p.notes[id]; if(!n) return;
  CUR[pid]=id;
  document.querySelectorAll('#p-'+pid+' mark.hl').forEach(m=>m.classList.toggle('on',m.dataset.note===id));
  const mk=document.querySelector('#p-'+pid+' mark.hl[data-note="'+id+'"]');
  if(!state.read[pid+'_'+id]){ state.read[pid+'_'+id]=true; if(mk) mk.classList.add('read'); save(); updateProgress(); }
  const ids=noteOrder(pid), i=ids.indexOf(id);
  let h='<span class="chip '+n.cat+'">'+CATNAME[n.cat]+'</span><div class="ntag">'+n.tag+'</div>';
  h+='<div class="nlat">'+(mk?mk.innerHTML.replace(/<span class="lb"[^>]*><\/span>/g,' / '):'')+'</div><div class="ntr">'+n.tr+'</div>';
  h+='<div class="nsec">What the writer does</div><p>'+n.what+'</p><div class="nsec">The effect</div><p>'+n.effect+'</p>';
  h+='<div class="nsec">How it would be written in the exam</div>';
  if(n.ex.style) h+='<div class="ex"><div class="exh"><span>Style question</span> · 4, 6 or 8 marks · quote, translate, explain, link</div><p>'+n.ex.style+'</p></div>';
  if(n.ex.content) h+='<div class="ex"><div class="exh"><span>Content or impression question</span> · in English, from these lines</div><p>'+n.ex.content+'</p></div>';
  if(n.ex.essay) h+='<div class="ex"><div class="exh"><span>16-mark essay</span> · in English, no Latin needed</div><p>'+n.ex.essay+'</p></div>';
  h+='<div class="nnav"><button class="btn" '+(i<=0?'disabled':'')+' onclick="stepNote(\''+pid+'\',-1)">◀ Previous</button><button class="btn" '+(i>=ids.length-1?'disabled':'')+' onclick="stepNote(\''+pid+'\',1)">Next ▶</button></div>';
  $('nb-'+pid).innerHTML=h; $('ncnt-'+pid).textContent=(i+1)+' of '+ids.length;
  const np=$('np-'+pid); np.classList.add('open'); np.scrollTop=0;
  if(window.innerWidth>900){ const r=np.getBoundingClientRect(); if(r.top<0||r.top>window.innerHeight-80) np.scrollIntoView({behavior:'smooth',block:'start'}); }
}
function stepNote(pid,d){ const ids=noteOrder(pid); const i=ids.indexOf(CUR[pid]); const j=i+d; if(j<0||j>=ids.length) return; openNote(pid,ids[j]); const mk=document.querySelector('#p-'+pid+' mark.hl[data-note="'+ids[j]+'"]'); if(mk&&window.innerWidth>900) mk.scrollIntoView({behavior:'smooth',block:'center'}); }
function closeSheet(){ document.querySelectorAll('.npanel').forEach(n=>n.classList.remove('open')); }

/* ===================== questions ===================== */
function wc(key){ const t=document.querySelector('textarea[data-q="'+key+'"]'); const el=$('wc-'+key); if(!t||!el) return; const n=(t.value.trim().match(/\S+/g)||[]).length; el.textContent=n?(n+' word'+(n===1?'':'s')):''; }
function reveal(key){ const t=document.querySelector('textarea[data-q="'+key+'"]');
  if(t && !t.value.trim() && !state.revealed[key]){ if(!confirm('You have not written an answer yet. Reveal the model anyway?')) return; }
  if(!state.revealed[key]){ state.revealed[key]=new Date().toISOString(); save(); }
  showRevealed(key); }
function showRevealed(key){ const md=$('md-'+key); if(md) md.classList.add('show'); const rv=$('rv-'+key); if(rv){ rv.textContent='Model answer shown'; rv.disabled=true; }
  const t=document.querySelector('textarea[data-q="'+key+'"]'); if(t){ t.readOnly=true; } const ul=$('ul-'+key); if(ul) ul.style.display='inline';
  const mk=state.marks[key]; document.querySelectorAll('.mk[data-key="'+key+'"]').forEach(b=>b.classList.toggle('on',mk!=null&&parseInt(b.dataset.v)===mk)); }
function unlock(key){ const t=document.querySelector('textarea[data-q="'+key+'"]'); if(t){ t.readOnly=false; t.focus(); } const ul=$('ul-'+key); if(ul) ul.style.display='none'; state.opened[key+'_improved']=new Date().toISOString(); save(); }
function setMark(key,v){ state.marks[key]=v; save(); document.querySelectorAll('.mk[data-key="'+key+'"]').forEach(b=>b.classList.toggle('on',parseInt(b.dataset.v)===v));
  const q=allQ().find(x=>x.key===key); const el=$('mkmsg-'+key); if(el&&q){ el.textContent=(v===q.q.marks?'Full marks — make sure every point really matched the scheme.':(v===0?'Read the scheme again, then unlock and improve your answer.':'Which point was missing? Unlock and add it.')); } updateProgress(); }
function setRag(v){ state.rag=v; save(); document.querySelectorAll('.rag button').forEach(b=>b.classList.toggle('on',b.textContent.startsWith(v))); }

function restoreAll(){
  document.querySelectorAll('textarea[data-q]').forEach(t=>{ t.value=state.answers[t.dataset.q]||''; wc(t.dataset.q); if(state.revealed[t.dataset.q]) showRevealed(t.dataset.q); });
  document.querySelectorAll('textarea[data-pnotes]').forEach(t=>{ t.value=state.pnotes[t.dataset.pnotes]||''; });
  document.querySelectorAll('mark.hl').forEach(m=>m.classList.toggle('read',!!state.read[m.dataset.pid+'_'+m.dataset.note]));
  if(state.rag) document.querySelectorAll('.rag button').forEach(b=>b.classList.toggle('on',b.textContent.startsWith(state.rag)));
  updateProgress();
}
function updateProgress(){
  let answered=0,total=0,got=0,max=0;
  BOOKLET.passages.forEach(p=>{ let a=0,m=0,mx=0; p.questions.forEach(q=>{ const k=p.id+'_'+q.id; total++; mx+=q.marks; if((state.answers[k]||'').trim()){ a++; answered++; } if(state.marks[k]!=null){ m+=state.marks[k]; got+=state.marks[k]; } }); max+=mx;
    const nr=Object.keys(p.notes).filter(k=>state.read[p.id+'_'+k]).length;
    $('nr-'+p.id).textContent=nr; $('qa-'+p.id).textContent=a; $('qm-'+p.id).textContent=m;
    $('tabdone-'+p.id).textContent=(a===p.questions.length&&a>0)?' ✓':(a?(' '+a+'/'+p.questions.length):''); });
  const sk='syn_syn'; total++; max+=BOOKLET.synthesis.marks; if((state.answers[sk]||'').trim()){ answered++; $('tabdone-syn').textContent=' ✓'; } else $('tabdone-syn').textContent=''; if(state.marks[sk]!=null) got+=state.marks[sk];
  $('pill').textContent=answered+'/'+total+' answered · '+got+'/'+max+' self-marked';
}

/* ===================== sign-in gate ===================== */
function showGate(){
  const ov=document.createElement('div'); ov.id='rp-gate';
  ov.style.cssText="position:fixed;inset:0;z-index:9999;background:rgba(8,8,14,.88);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;font-family:Georgia,serif;";
  ov.innerHTML='<div style="max-width:440px;width:100%;background:linear-gradient(180deg,#f6eed6,#e6d6b4);border-top:6px solid #c69a3c;border-radius:14px;padding:26px 26px 22px;box-shadow:0 22px 60px rgba(0,0,0,.6);color:#2b2012;">'
    +'<div style="font-size:12.5px;letter-spacing:2px;color:#8f3320;font-weight:700;">EDUQAS GCSE LATIN · HEROES &amp; VILLAINS · BOOKLET '+BOOKLET.num+'</div>'
    +'<div style="font-size:23px;color:#7a2f1e;font-weight:800;margin:2px 0 3px;letter-spacing:.5px;">'+BOOKLET.title+': '+BOOKLET.subtitle+'</div>'
    +'<div style="font-size:13px;color:#6b5636;margin-bottom:16px;font-style:italic;">'+BOOKLET.gateLine+'</div>'
    +'<label style="font-size:13px;color:#7a2f1e;font-weight:700;">Class code</label>'
    +'<input id="g-cls" autocomplete="off" value="'+FIXEDCLS+'" readonly tabindex="-1" style="width:100%;box-sizing:border-box;margin:5px 0 4px;padding:11px;border-radius:8px;border:1px solid #c9b686;background:#ece3cc;color:#2b2012;font-size:15px;font-family:Georgia,serif;cursor:default;">'
    +'<div style="font-size:11.5px;color:#7a6e57;margin:0 0 12px;">Your class code is filled in for you — leave it as it is. <span id="g-unlock" style="text-decoration:underline;cursor:pointer;">teacher: change it</span></div>'
    +'<label style="font-size:13px;color:#7a2f1e;font-weight:700;">Your name</label>'
    +'<input id="g-cand" autocomplete="off" placeholder="e.g. Tom" style="width:100%;box-sizing:border-box;margin:5px 0 4px;padding:11px;border-radius:8px;border:1px solid #c9b686;background:#fbf6e6;color:#2b2012;font-size:15px;font-family:Georgia,serif;">'
    +'<div id="g-err" style="color:#a12016;font-size:12.5px;min-height:17px;margin:3px 0 6px;"></div>'
    +'<button id="g-go" style="width:100%;padding:12px;border:0;border-radius:8px;background:linear-gradient(135deg,#caa04a,#9a6b1e);color:#221806;font-weight:800;font-size:15px;cursor:pointer;font-family:Georgia,serif;letter-spacing:.5px;">Open the booklet</button>'
    +'<div style="font-size:11.5px;color:#8a7048;margin-top:13px;line-height:1.5;">Use the <b>same spelling of your name</b> every time, so all your work lands in one place.</div>'
    +'</div>';
  document.body.appendChild(ov);
  $('g-go').addEventListener('click',signIn);
  ov.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); signIn(); } });
  $('g-unlock').addEventListener('click',function(){ const c=$('g-cls'); c.removeAttribute('readonly'); c.removeAttribute('tabindex'); c.style.background='#fbf6e6'; c.style.cursor='text'; c.select(); this.parentNode.removeChild(this); });
  const last=safeGet('hv_booklet_lastname'); if(last) $('g-cand').value=last;
  $('g-cand').focus();
}
let _signingIn=false;
async function signIn(){
  const cls=($('g-cls').value||'').trim().toUpperCase(); const cand=($('g-cand').value||'').trim().replace(/\s+/g,' '); const err=$('g-err');
  if(_signingIn) return;
  if(!cls){ err.textContent='Enter your class code.'; return; }
  if(!/^.{2,40}$/.test(cand)){ err.textContent='Please enter your name (2-40 characters).'; return; }
  _signingIn=true; IDENTITY={cls,cand}; safeSet('hv_booklet_lastname',cand); $('g-go').textContent='Loading your work…'; $('g-go').disabled=true;
  loadLocal();
  const res=await Promise.race([CloudStore.pull(), new Promise(r=>setTimeout(()=>r({ok:false}),6000))]);
  if(res.ok&&res.data&&res.data.state) mergeState(res.data.state);
  safeSet(storeKey(),JSON.stringify(state));
  const g=$('rp-gate'); if(g) g.remove();
  $('whoami').innerHTML='Signed in: <b>'+esc(IDENTITY.cls)+' · '+esc(IDENTITY.cand)+'</b>';
  restoreAll(); setSync(res.ok?'cloud':'offline');
  if(res.ok) save();
}
function signOut(){ IDENTITY=null; location.reload(); }

renderAll();
showGate();
</script>
